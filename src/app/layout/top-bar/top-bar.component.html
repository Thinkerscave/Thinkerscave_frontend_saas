<header class="topbar-container">
  <div class="topbar-left">
    <button type="button" class="icon-btn nav-toggle" (click)="toggleNavigation()" aria-label="Toggle navigation">
      <i class="pi pi-bars"></i>
    </button>

    <button type="button" class="brand-identity brand-identity--compact" (click)="navigateHome()" aria-label="Go to dashboard">
      <span class="brand-logo"><img src="thinkerscave2.ico" alt="" aria-hidden="true"></span>
      <div class="brand-copy">
        <strong>ThinkerScave</strong>
        <small>{{ getOrganizationName() }}</small>
      </div>
    </button>
  </div>

  <div class="topbar-center">
    <app-global-search></app-global-search>
  </div>

  <div class="topbar-right">
    <button type="button" class="icon-btn" (click)="toggleTheme()" [title]="isDarkTheme() ? 'Switch to Light Mode' : 'Switch to Dark Mode'">
      <i class="pi" [ngClass]="isDarkTheme() ? 'pi-sun' : 'pi-moon'"></i>
    </button>

    <button type="button" class="icon-btn" (click)="openSettings()" title="Settings">
      <i class="pi pi-cog"></i>
    </button>

    <app-notification-center></app-notification-center>

    <div class="profile-menu">
      <button type="button" class="profile-btn" (click)="userPanel.toggle($event)">
        <div class="avatar" *ngIf="photoUrl(); else avatarInitials"><img [src]="photoUrl()" [alt]="getUserName()"></div>
        <ng-template #avatarInitials><div class="avatar is-initials">{{ getInitials(getUserName()) }}</div></ng-template>
        <div class="user-info">
          <span class="name">{{ getUserName() }}</span>
          <span class="role">{{ getRoleName() }}</span>
        </div>
        <i class="pi pi-angle-down drop-icon"></i>
      </button>

      <p-overlayPanel #userPanel appendTo="body" styleClass="tc-dropdown-panel user-panel">
        <div class="user-dropdown-header">
          <div class="avatar lg" *ngIf="photoUrl(); else avatarInitialsLg"><img [src]="photoUrl()" [alt]="getUserName()"></div>
          <ng-template #avatarInitialsLg><div class="avatar lg is-initials">{{ getInitials(getUserName()) }}</div></ng-template>
          <div>
            <strong>{{ getUserName() }}</strong>
            <small>{{ currentUser?.userName }}</small>
          </div>
        </div>
        <hr>
        <button class="dropdown-item" (click)="router.navigate(['/app/profile']); userPanel.hide()">
          <i class="pi pi-user"></i> My Profile
        </button>
        <button class="dropdown-item" (click)="openSettings(); userPanel.hide()">
          <i class="pi pi-cog"></i> Settings
        </button>
        <button class="dropdown-item" *ngIf="canOpenOrganizationProfile()" (click)="openOrganizationProfile(); userPanel.hide()">
          <i class="pi pi-building"></i> Organization Profile
        </button>
        <hr>
        <button class="dropdown-item text-danger" (click)="logout()">
          <i class="pi pi-power-off"></i> Logout
        </button>
      </p-overlayPanel>
    </div>
  </div>
</header>
