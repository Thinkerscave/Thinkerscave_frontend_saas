<div class="topbar-container">
  <div class="topbar-left">
    <button class="sidebar-toggle" type="button" (click)="onToggleSidebar()"
      [attr.aria-label]="isSidebarExpanded ? 'Collapse sidebar' : 'Expand sidebar'"
      [class.is-active]="isSidebarExpanded">
      <i class="pi" [ngClass]="isSidebarExpanded ? 'pi-chevron-left' : 'pi-bars'"></i>
    </button>
    <div class="app-name">ThinkerScave</div>
  </div>

  <div class="topbar-actions">
    <app-global-search class="topbar-search"></app-global-search>

    <button class="theme-toggle" type="button" (click)="toggleTheme()"
      [attr.aria-label]="isDarkTheme() ? 'Switch to light theme' : 'Switch to dark theme'"
      [attr.title]="isDarkTheme() ? 'Switch to light theme' : 'Switch to dark theme'">
      <i class="pi" [ngClass]="isDarkTheme() ? 'pi-sun' : 'pi-moon'"></i>
    </button>

    <div class="profile-wrapper">
    <!-- Profile Button -->
    <button pButton type="button" class="profile-btn" (click)="profileMenu.toggle($event)">
      <div class="profile-initials">{{ userName | initials }}</div>
      <span class="user-name">{{ userName }}</span>
      <i class="pi pi-chevron-down"></i>
    </button>

    <!-- Profile Menu -->
    <p-menu #profileMenu [popup]="true" [model]="profileItems"></p-menu>
    </div>
  </div>
</div>
