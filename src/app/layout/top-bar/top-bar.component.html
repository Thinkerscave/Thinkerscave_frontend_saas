<div class="topbar-container">
  <div class="topbar-left">
    <button class="hamburger-btn" type="button" (click)="onToggleSidebar()"
      [attr.aria-label]="isSidebarCollapsed ? 'Expand sidebar' : 'Collapse sidebar'"
      [class.is-active]="!isSidebarCollapsed">
      <span></span>
      <span></span>
      <span></span>
    </button>
    <div class="app-name">ThinkerScave</div>
  </div>

  <div class="topbar-actions">
    <button class="theme-toggle" type="button" (click)="toggleTheme()"
      [attr.aria-label]="isDarkTheme() ? 'Switch to light theme' : 'Switch to dark theme'"
      [attr.title]="isDarkTheme() ? 'Switch to light theme' : 'Switch to dark theme'">
      <i class="pi" [ngClass]="isDarkTheme() ? 'pi-sun' : 'pi-moon'"></i>
    </button>

    <div class="profile-wrapper">
    <!-- Profile Button -->
    <button pButton type="button" class="profile-btn" (click)="profileMenu.toggle($event)">
      <div class="profile-initials">{{ getInitials(userName) }}</div>
      <span class="user-name">{{ userName }}</span>
      <i class="pi pi-chevron-down"></i>
    </button>

    <!-- Profile Menu -->
    <p-menu #profileMenu [popup]="true" [model]="profileItems"></p-menu>
    </div>
  </div>
</div>
