<header class="topbar-container">
  <div class="topbar-left">
    <button type="button" class="icon-btn nav-toggle" (click)="toggleNavigation()" aria-label="Toggle navigation">
      <i class="pi pi-bars"></i>
    </button>

    <button type="button" class="brand-identity brand-identity--compact" (click)="navigateHome()" aria-label="Go to dashboard">
      <span class="brand-logo">
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M12 2L2 7l10 5 10-5-10-5zM2 17l10 5 10-5M2 12l10 5 10-5"/>
        </svg>
      </span>
      <div class="brand-copy">
        <strong>ThinkerScave</strong>
        <small>{{ getOrganizationName() }}</small>
      </div>
    </button>
  </div>

  <div class="topbar-center">
    <app-global-search></app-global-search>
  </div>

  <div class="topbar-right">
    <button
      *ngIf="canSwitchOrganization()"
      type="button"
      class="icon-btn"
      (click)="orgPanel.toggle($event)"
      title="Switch organization"
      aria-label="Switch organization">
      <i class="pi pi-building"></i>
    </button>

    <p-overlayPanel #orgPanel appendTo="body" styleClass="tc-dropdown-panel user-panel">
      <div class="user-dropdown-header">
        <div>
          <strong>Organization Switcher</strong>
          <small>{{ currentOrganizationName() }}</small>
        </div>
      </div>
      <hr>
      <button
        class="dropdown-item"
        *ngFor="let org of organizations()"
        (click)="switchOrganization(org, orgPanel)"
        [disabled]="switchingOrg() === org.organizationId">
        <i class="pi" [ngClass]="org.current ? 'pi-check-circle' : 'pi-circle-off'"></i>
        {{ org.organizationName }}
      </button>
    </p-overlayPanel>

    <button type="button" class="icon-btn" (click)="toggleTheme()" [title]="isDarkTheme() ? 'Switch to Light Mode' : 'Switch to Dark Mode'">
      <i class="pi" [ngClass]="isDarkTheme() ? 'pi-sun' : 'pi-moon'"></i>
    </button>

    <button type="button" class="icon-btn" (click)="openSettings()" title="Settings">
      <i class="pi pi-cog"></i>
    </button>

    <app-notification-center></app-notification-center>

    <div class="profile-menu">
      <button type="button" class="profile-btn" (click)="userPanel.toggle($event)">
        <div class="tc-avatar" *ngIf="photoUrl(); else avatarInitials"><img [src]="photoUrl()" [alt]="getUserName()"></div>
        <ng-template #avatarInitials><div class="tc-avatar tc-avatar--initials">{{ getInitials(getUserName()) }}</div></ng-template>
        <div class="user-info">
          <span class="name">{{ getUserName() }}</span>
          <span class="role">{{ getRoleName() }}</span>
        </div>
        <i class="pi pi-angle-down drop-icon"></i>
      </button>

      <p-overlayPanel #userPanel appendTo="body" styleClass="tc-dropdown-panel user-panel">
        <div class="user-dropdown-header">
          <div class="tc-avatar tc-avatar--lg" *ngIf="photoUrl(); else avatarInitialsLg"><img [src]="photoUrl()" [alt]="getUserName()"></div>
          <ng-template #avatarInitialsLg><div class="tc-avatar tc-avatar--lg tc-avatar--initials">{{ getInitials(getUserName()) }}</div></ng-template>
          <div>
            <strong>{{ getUserName() }}</strong>
            <small>{{ currentUser?.userName }}</small>
          </div>
        </div>
        <hr>
        <button class="dropdown-item" (click)="router.navigate(['/app/profile']); userPanel.hide()">
          <i class="pi pi-user"></i> My Profile
        </button>
        <button class="dropdown-item" (click)="openSettings(); userPanel.hide()">
          <i class="pi pi-cog"></i> Settings
        </button>
        <button class="dropdown-item" *ngIf="canOpenOrganizationProfile()" (click)="openOrganizationProfile(); userPanel.hide()">
          <i class="pi pi-building"></i> Organization Profile
        </button>
        <hr>
        <button class="dropdown-item text-danger" (click)="logout()">
          <i class="pi pi-power-off"></i> Logout
        </button>
      </p-overlayPanel>
    </div>
  </div>
</header>
