@if (activeWorkspace; as workspace) {
  <section class="workspace-tabs" [attr.data-workspace]="workspace.key" aria-label="Workspace navigation">
    <div class="workspace-tabs__label">
      <span><i [class]="workspace.icon"></i></span>
      <div>
        <small>{{ workspace.eyebrow }}</small>
        <strong>{{ workspace.label }}</strong>
      </div>
    </div>

    <nav class="workspace-tabs__nav">
      @for (tab of workspace.tabs; track tab.route) {
        <a [routerLink]="tab.route" routerLinkActive="is-active" [routerLinkActiveOptions]="{ exact: false }">
          <i [class]="tab.icon"></i>
          <span>{{ tab.label }}</span>
        </a>
      }
    </nav>
  </section>
}
