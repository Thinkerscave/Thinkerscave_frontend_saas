<div class="layout-container">
  <app-top-bar class="topbar"></app-top-bar>

  <div class="main-content" [class.sidebar-is-expanded]="sidebarLayout.isMobileDrawerOpen() || sidebarLayout.isTabletPinned()">
    <app-side-menu class="sidemenu"></app-side-menu>

    <div class="page-content">
      <tc-page-shell>
        <app-breadcrumb tcPageHeader></app-breadcrumb>
        <router-outlet></router-outlet>
      </tc-page-shell>
    </div>
  </div>

  <app-footer class="footer"></app-footer>
  <app-pwa-banners></app-pwa-banners>

  <tc-drawer-form
    [open]="settingsUi.isOpen()"
    [title]="settingsTitle()"
    [description]="settingsDescription()"
    size="md"
    (closed)="settingsUi.close()">
    <tc-global-settings #settingsPanel></tc-global-settings>
    <div drawer-actions class="settings-drawer-actions">
      <button type="button" class="settings-drawer-actions__ghost" (click)="settingsUi.close()">
        {{ 'common.close' | tcTranslate }}
      </button>
      <button type="button" class="settings-drawer-actions__ghost" (click)="settingsPanel.reset()">
        <i class="pi pi-refresh"></i> {{ 'common.reset' | tcTranslate }}
      </button>
      <button type="button" class="settings-drawer-actions__primary" (click)="settingsPanel.save()">
        <i class="pi pi-check"></i> {{ 'common.save' | tcTranslate }}
      </button>
    </div>
  </tc-drawer-form>
</div>
