<div class="layout-container" [class.sidebar-expanded]="isSidebarExpanded">
  <app-top-bar class="topbar" [isSidebarExpanded]="isSidebarExpanded"
    (toggleSidebar)="toggleSidebar()"></app-top-bar>

  <div class="main-content">
    <app-side-menu class="sidemenu" [expanded]="isSidebarExpanded"></app-side-menu>
    <button class="sidebar-backdrop" type="button" aria-label="Close sidebar" (click)="toggleSidebar()"></button>

    <div class="page-content">
      <tc-page-shell>
        <app-breadcrumb tcPageHeader></app-breadcrumb>
        <app-workspace-tabs></app-workspace-tabs>
        <router-outlet></router-outlet>
      </tc-page-shell>
    </div>
  </div>

  <app-footer class="footer"></app-footer>
</div>
