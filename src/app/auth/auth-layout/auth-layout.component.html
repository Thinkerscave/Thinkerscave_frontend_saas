<div class="auth-shell" [class.auth-shell--focused]="isLogin()" [class.auth-shell--org-select]="isOrgSelect()">
  <div class="auth-card" [class.auth-card--focused]="isLogin()" [class.auth-card--org-select]="isOrgSelect()">
    <div class="auth-pane auth-pane--form">
      <a routerLink="/" class="auth-brand" aria-label="ThinkersCave home">
        <span class="auth-brand__mark" aria-hidden="true"><i class="pi pi-graduation-cap"></i></span>
        <span class="auth-brand__name">ThinkersCave</span>
      </a>
      <main class="auth-pane__main">
        <router-outlet></router-outlet>
      </main>
    </div>

    @if (!isLogin()) {
      <aside class="auth-pane auth-pane--visual" aria-hidden="true">
        @if (isOrgSelect()) {
          <tc-auth-illustration
            tone="light"
            headline="Empowering Education."
            subline="Inspiring Futures."
            caption="One intelligent platform connecting students, teachers, administrators, and parents."
          />
          <div class="auth-pane__trust">
            <tc-auth-trust-strip />
          </div>
        } @else {
          <tc-auth-illustration tone="light" />
        }
      </aside>
    }
  </div>
</div>
