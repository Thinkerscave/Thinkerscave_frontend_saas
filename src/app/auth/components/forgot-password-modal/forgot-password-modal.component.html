<p-dialog
  [visible]="visible()"
  (visibleChange)="visible.set($event)"
  [modal]="true"
  [closable]="true"
  [draggable]="false"
  [style]="{ width: 'min(440px, 92vw)' }"
  header="Reset your password"
  (onHide)="close()"
>
  @switch (step()) {
    @case (1) {
      <form [formGroup]="emailForm" (ngSubmit)="sendOtp()" class="fp-form">
        <p class="fp-lead">Enter your email and we'll send a one-time code.</p>
        <div class="fp-field">
          <label for="fp-email">Email</label>
          <input id="fp-email" type="email" pInputText formControlName="email" placeholder="you@institution.edu" />
        </div>
        <button pButton type="submit" label="Send OTP" [loading]="loading()" [disabled]="emailForm.invalid"></button>
      </form>
    }
    @case (2) {
      <form [formGroup]="otpForm" (ngSubmit)="verifyOtp()" class="fp-form">
        <p class="fp-lead">Enter the code sent to {{ emailForm.value.email }}.</p>
        <div class="fp-field">
          <label for="fp-otp">Verification code</label>
          <input id="fp-otp" type="text" pInputText formControlName="otp" inputmode="numeric" autocomplete="one-time-code" />
        </div>
        <button pButton type="submit" label="Verify" [loading]="loading()" [disabled]="otpForm.invalid"></button>
        <button pButton type="button" label="Resend code" class="p-button-text" (click)="resendOtp()"></button>
      </form>
    }
    @case (3) {
      <form [formGroup]="passwordForm" (ngSubmit)="resetPassword()" class="fp-form">
        <p class="fp-lead">Choose a strong new password.</p>
        <div class="fp-field">
          <label for="fp-new">New password</label>
          <p-password id="fp-new" formControlName="newPassword" [feedback]="true" [toggleMask]="true" styleClass="fp-password" inputStyleClass="fp-password__input"></p-password>
        </div>
        <div class="fp-field">
          <label for="fp-confirm">Confirm password</label>
          <p-password id="fp-confirm" formControlName="confirmPassword" [feedback]="false" [toggleMask]="true" styleClass="fp-password" inputStyleClass="fp-password__input"></p-password>
        </div>
        <button pButton type="submit" label="Update password" [loading]="loading()" [disabled]="passwordForm.invalid"></button>
      </form>
    }
  }
</p-dialog>
