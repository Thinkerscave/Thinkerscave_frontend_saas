<div class="p-fluid text-center fade-in">
    <h2 class="text-900 mb-4 text-center">Forgot Password</h2>

    <!-- Step 1: Email + Get OTP -->
    @if (step === 1) {
        <form [formGroup]="emailForm" (ngSubmit)="sendOtp()">
            <div class="field mb-3">
                <label for="email" class="block font-semibold mb-2 text-left w-full">Email</label>
                <input id="email" type="email" pInputText formControlName="email" class="w-full"
                       placeholder="Enter your registered email" />
            </div>

            <button pButton type="submit" label="Get OTP" [disabled]="emailForm.invalid"
                    class="p-button-sm w-6 mx-auto mt-2 mb-3 p-button-rounded"></button>

            <div class="text-right mt-3">
                <a routerLink="/login"
                   class="text-sm text-gray-800 hover:text-blue-600 transition-colors duration-300 no-underline">
                    &larr; Back to Login
                </a>
            </div>
        </form>
    }

    <!-- Step 2: Enter OTP -->
    @if (step === 2) {
        <form [formGroup]="otpForm" (ngSubmit)="verifyOtp()">
            <div class="text-sm text-gray-800 mb-3">
                An OTP has been sent to your registered email address.
            </div>

            <div class="field mb-3">
                <label for="otp" class="block font-semibold mb-2 text-left w-full">Enter OTP</label>
                <input id="otp" type="text" pInputText formControlName="otp" class="w-full"
                       placeholder="Enter 6-digit OTP" />
            </div>
            <div class="flex justify-content-between items-center mb-3 text-sm text-gray-700">
                <span class="mb-1">Didn't receive OTP?</span>
                <button pButton type="button" label="Resend OTP" class="p-button-text p-button-sm p-button-plain"
                        (click)="resendOtp()"></button>
            </div>
            <button pButton type="submit" label="Verify OTP" [disabled]="otpForm.invalid"
                    class="p-button-sm w-6 mx-auto mt-2 mb-3 p-button-rounded"></button>
        </form>
    }

    <!-- Step 3: Reset Password -->
    @if (step === 3) {
        <form [formGroup]="passwordForm" (ngSubmit)="resetPassword()">
            <div class="field mb-3">
                <label for="newPassword" class="block font-semibold mb-2 text-left w-full">New Password</label>
                <p-password id="newPassword" formControlName="newPassword" [feedback]="false"
                            [toggleMask]="true" styleClass="w-full" inputStyleClass="w-full"
                            placeholder="Enter New Password"></p-password>
            </div>

            <div class="field mb-3">
                <label for="confirmPassword" class="block font-semibold mb-2 text-left w-full">Confirm Password</label>
                <p-password id="confirmPassword" formControlName="confirmPassword" [feedback]="false"
                            [toggleMask]="true" styleClass="w-full" inputStyleClass="w-full"
                            placeholder="Re-type your Password"></p-password>
            </div>

            <button pButton type="submit" label="Reset Password" [disabled]="passwordForm.invalid"
                    class="p-button-sm w-6 mx-auto mt-2 mb-3 p-button-rounded"></button>
        </form>
    }
</div>
