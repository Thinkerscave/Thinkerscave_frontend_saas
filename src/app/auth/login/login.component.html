<section class="login-panel fade-in">
  <div class="login-panel__header">
    @if (selectedOrg) {
      <p class="org-context">
        <span class="org-context__avatar" aria-hidden="true">{{ selectedOrg.name.charAt(0) }}</span>
        Signing in to <strong>{{ selectedOrg.name }}</strong>
        <a routerLink="/auth/select-organization" class="link">Change</a>
      </p>
    }
    <p class="eyebrow">Workspace Access</p>
    <h2>Welcome back</h2>
    <p class="subtitle">Sign in to your ThinkerScave workspace</p>
  </div>

  <form [formGroup]="loginForm" (ngSubmit)="login()" class="login-panel__form" novalidate>
    <p-floatlabel variant="on" class="form-field">
      <input id="username" type="text" pInputText formControlName="username" autocomplete="username" />
      <label for="username">Username or email</label>
    </p-floatlabel>

    <p-floatlabel variant="on" class="form-field">
      <p-password
        id="password"
        formControlName="password"
        [feedback]="false"
        [toggleMask]="true"
        styleClass="login-password"
        inputStyleClass="login-password__input"
        autocomplete="current-password"
      ></p-password>
      <label for="password">Password</label>
    </p-floatlabel>

    <div class="login-panel__meta">
      <div class="remember-me">
        <p-checkbox inputId="remember" binary="true" formControlName="rememberMe"></p-checkbox>
        <label for="remember">Remember this device</label>
      </div>
      <button type="button" class="link link--button" (click)="openForgotPassword()">Forgot password?</button>
    </div>

    <button pButton type="submit" label="Sign In" class="accent-button" [disabled]="loginForm.invalid"></button>
  </form>

  <app-forgot-password-modal />
</section>
