<section class="login-panel fade-in">
  @if (selectedOrg) {
    <div class="login-org" role="status">
      <span class="login-org__label">Signing in to</span>
      <div class="login-org__row">
        <span class="login-org__avatar" aria-hidden="true">{{ selectedOrg.name.charAt(0) }}</span>
        <strong>{{ selectedOrg.name }}</strong>
        <a routerLink="/auth/select-organization" class="login-org__change">Change</a>
      </div>
    </div>
  }

  <header class="login-panel__header">
    <h1>Welcome back</h1>
    <p class="login-panel__subtitle">Sign in to continue to your ThinkerScave workspace.</p>
  </header>

  <form [formGroup]="loginForm" (ngSubmit)="login()" class="login-panel__form" novalidate>
    <div class="field">
      <label for="username" class="sr-only">Username or email</label>
      <span class="field__icon" aria-hidden="true"><i class="pi pi-envelope"></i></span>
      <input
        id="username"
        type="text"
        formControlName="username"
        placeholder="Username or email"
        autocomplete="username"
        [class.field__input--invalid]="loginForm.get('username')?.invalid && loginForm.get('username')?.touched"
      />
    </div>

    <div class="field">
      <label for="password" class="sr-only">Password</label>
      <span class="field__icon" aria-hidden="true"><i class="pi pi-lock"></i></span>
      <input
        id="password"
        type="password"
        formControlName="password"
        placeholder="Password"
        autocomplete="current-password"
        [class.field__input--invalid]="loginForm.get('password')?.invalid && loginForm.get('password')?.touched"
      />
    </div>

    <div class="login-panel__meta">
      <label class="remember">
        <input type="checkbox" formControlName="rememberMe" />
        <span>Remember this device</span>
      </label>
      <button type="button" class="link-btn" (click)="openForgotPassword()">Forgot password?</button>
    </div>

    <button type="submit" class="sign-in-btn" [disabled]="loginForm.invalid || submitting()">
      @if (submitting()) {
        <span class="sign-in-btn__spinner" aria-hidden="true"></span>
        Signing in...
      } @else {
        <i class="pi pi-lock" aria-hidden="true"></i>
        Sign In
        <i class="pi pi-arrow-right" aria-hidden="true"></i>
      }
    </button>
  </form>

  <p class="login-panel__security">
    <i class="pi pi-shield" aria-hidden="true"></i>
    Protected by enterprise-grade security. Your data is encrypted and secure.
  </p>

  <app-forgot-password-modal />
</section>
