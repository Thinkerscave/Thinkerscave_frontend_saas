<app-workspace-header
    title="Responsibilities"
    subtitle="Role-based access"
    description="Define responsibilities, map privileges and assign them to users."
    icon="pi pi-shield"
    [breadcrumbs]="[{ label: 'Administration' }, { label: 'Responsibilities' }]">
    <ng-container actions>
        <p-button label="New responsibility" icon="pi pi-plus"
                  (onClick)="router.navigate(['/app/responsibilities/new'])"></p-button>
    </ng-container>
</app-workspace-header>

<section class="tc-kpi-strip">
    <app-kpi-card label="Total"             [value]="responsibilities().length" icon="pi pi-shield" tone="info"></app-kpi-card>
    <app-kpi-card label="Privileges mapped" [value]="totalPrivileges()"          icon="pi pi-key"    tone="info"></app-kpi-card>
</section>

<section class="tc-card">
    <ng-container *ngIf="loading(); else loaded">
        <app-skeleton shape="table" [rows]="6" [columns]="4"></app-skeleton>
    </ng-container>

    <ng-template #loaded>
        <ng-container *ngIf="responsibilities().length; else empty">
            <p-table [value]="responsibilities()" [paginator]="true" [rows]="10"
                     [rowsPerPageOptions]="[10, 20, 50, 100]"
                     [showCurrentPageReport]="true"
                     currentPageReportTemplate="Showing {first}–{last} of {totalRecords} results"
                     styleClass="p-datatable-sm" responsiveLayout="scroll">
                <ng-template pTemplate="header">
                    <tr>
                        <th>Code</th>
                        <th>Name</th>
                        <th>Description</th>
                        <th>Privileges</th>
                        <th class="tc-col-actions"></th>
                    </tr>
                </ng-template>
                <ng-template pTemplate="body" let-row>
                    <tr>
                        <td><strong>{{ row.code }}</strong></td>
                        <td>{{ row.name }}</td>
                        <td class="tc-text-muted">{{ row.description || '—' }}</td>
                        <td><p-tag severity="info" [value]="(row.privilegeIds?.length || 0) + ' mapped'"></p-tag></td>
                        <td class="tc-row-actions">
                            <p-button icon="pi pi-pencil" [text]="true" size="small" pTooltip="Edit"
                                      (onClick)="router.navigate(['/app/responsibilities', row.id, 'edit'])"></p-button>
                            <p-button icon="pi pi-trash" [text]="true" size="small" severity="danger" pTooltip="Delete"
                                      (onClick)="confirmDelete(row)"></p-button>
                        </td>
                    </tr>
                </ng-template>
            </p-table>
        </ng-container>

        <ng-template #empty>
            <app-empty-state
                icon="pi pi-shield"
                title="No responsibilities defined"
                message="Create your first responsibility and map privileges to it."
                actionLabel="New responsibility"
                actionIcon="pi pi-plus"
                (action)="router.navigate(['/app/responsibilities/new'])"></app-empty-state>
        </ng-template>
    </ng-template>
</section>

<p-confirmDialog></p-confirmDialog>
