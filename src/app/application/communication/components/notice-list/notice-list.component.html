<app-workspace-header
    title="Notices"
    subtitle="Communication"
    description="Publish announcements to students, staff and parents."
    icon="pi pi-megaphone"
    [breadcrumbs]="[{ label: 'Communication' }, { label: 'Notices' }]">
    <ng-container actions>
        <p-button label="New notice" icon="pi pi-plus"
                  (onClick)="router.navigate(['/app/communication/notices/new'])"></p-button>
    </ng-container>
</app-workspace-header>

<section class="tc-kpi-strip">
    <app-kpi-card label="Total"     [value]="notices().length"     icon="pi pi-list"          tone="info"></app-kpi-card>
    <app-kpi-card label="Draft"     [value]="countBy('DRAFT')"     icon="pi pi-file-edit"     tone="default"></app-kpi-card>
    <app-kpi-card label="Published" [value]="countBy('PUBLISHED')" icon="pi pi-check-circle"  tone="success"></app-kpi-card>
    <app-kpi-card label="Archived"  [value]="countBy('ARCHIVED')"  icon="pi pi-inbox"         tone="warning"></app-kpi-card>
</section>

<section class="tc-card">
    <ng-container *ngIf="loading(); else loaded">
        <app-skeleton shape="table" [rows]="6" [columns]="5"></app-skeleton>
    </ng-container>

    <ng-template #loaded>
        <ng-container *ngIf="notices().length; else empty">
            <p-table [value]="notices()" [paginator]="true" [rows]="10"
                     styleClass="p-datatable-sm" responsiveLayout="scroll">
                <ng-template pTemplate="header">
                    <tr>
                        <th>Title</th>
                        <th>Audience</th>
                        <th>Status</th>
                        <th>Published</th>
                        <th style="width: 12rem"></th>
                    </tr>
                </ng-template>
                <ng-template pTemplate="body" let-row>
                    <tr>
                        <td>{{ row.title }}</td>
                        <td>{{ row.audience }}</td>
                        <td><app-status-badge [status]="row.status"></app-status-badge></td>
                        <td>{{ row.publishedAt ? (row.publishedAt | date: 'medium') : '—' }}</td>
                        <td class="tc-row-actions">
                            <p-button *ngIf="row.status === 'DRAFT'"
                                      icon="pi pi-send" [text]="true" size="small"
                                      pTooltip="Publish" (onClick)="transition(row, 'PUBLISHED')"></p-button>
                            <p-button *ngIf="row.status === 'PUBLISHED'"
                                      icon="pi pi-inbox" [text]="true" size="small"
                                      pTooltip="Archive" (onClick)="transition(row, 'ARCHIVED')"></p-button>
                            <p-button icon="pi pi-pencil" [text]="true" size="small" pTooltip="Edit"
                                      (onClick)="router.navigate(['/app/communication/notices', row.id, 'edit'])"></p-button>
                        </td>
                    </tr>
                </ng-template>
            </p-table>
        </ng-container>

        <ng-template #empty>
            <app-empty-state
                icon="pi pi-megaphone"
                title="No notices yet"
                message="Create your first announcement and publish it to your audience."
                actionLabel="Create notice"
                actionIcon="pi pi-plus"
                (action)="router.navigate(['/app/communication/notices/new'])"></app-empty-state>
        </ng-template>
    </ng-template>
</section>

<p-confirmDialog></p-confirmDialog>
