<div class="p-fluid max-w-4xl">
    <form [formGroup]="structureForm" (ngSubmit)="onSubmit()">
        <div class="grid">
            <div class="col-12 md:col-6 field">
                <label for="name" class="font-semibold">Name</label>
                <input pInputText id="name" formControlName="containerName" class="w-full" />
            </div>
            <div class="col-12 md:col-6 field">
                <label for="code" class="font-semibold">Code</label>
                <input pInputText id="code" formControlName="containerCode" class="w-full" />
            </div>
            <div class="col-12 md:col-6 field">
                <label for="type" class="font-semibold">Type</label>
                <p-dropdown [options]="containerTypes" formControlName="containerType" placeholder="Select Type"
                    class="w-full"></p-dropdown>
            </div>
            <div class="col-12 md:col-6 field">
                <label for="level" class="font-semibold">Level</label>
                <input pInputText type="number" id="level" formControlName="level" class="w-full" />
            </div>
            <div class="col-12 md:col-6 field" *ngIf="structureForm.get('parentContainerId')?.value">
                <label class="font-semibold">Parent Container ID</label>
                <input pInputText type="text" formControlName="parentContainerId" class="w-full" readonly
                    [attr.disabled]="true" />
            </div>
        </div>
        <div class="flex justify-content-end gap-2 mt-4">
            <button pButton label="Cancel" type="button" class="p-button-text" (click)="onCancel()"></button>
            <button pButton label="Save" type="submit" class="p-button-primary"></button>
        </div>
    </form>
</div>
