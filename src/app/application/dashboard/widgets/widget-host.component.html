<ng-container *ngIf="widget.widgetType === 'WELCOME_HEADER'; else cardWidget">
  <tc-welcome-header-widget [data]="widget.data" [state]="widget.state"></tc-welcome-header-widget>
</ng-container>

<ng-template #cardWidget>
  <tc-widget-card
    [title]="widget.title"
    [subtitle]="widget.subtitle"
    [icon]="chrome.icon"
    [state]="widget.state"
    [dataMode]="widget.dataMode"
    [errorMessage]="widget.errorMessage"
    [emptyMessage]="chrome.emptyMessage"
    [emptyIcon]="chrome.emptyIcon"
    (retry)="retry.emit(widget)">
    <ng-container [ngSwitch]="widget.widgetType">
      <tc-kpi-grid-widget *ngSwitchCase="'KPI_GRID'" [data]="widget.data"></tc-kpi-grid-widget>
      <tc-chart-widget *ngSwitchCase="'CHART'" [data]="widget.data"></tc-chart-widget>
      <tc-stat-list-widget *ngSwitchCase="'STAT_LIST'" [items]="widget.data.items"></tc-stat-list-widget>
      <tc-recent-activity-widget *ngSwitchCase="'RECENT_ACTIVITY'" [data]="widget.data"></tc-recent-activity-widget>
      <tc-pending-tasks-widget *ngSwitchCase="'PENDING_TASKS'" [data]="widget.data"></tc-pending-tasks-widget>
      <tc-notifications-widget *ngSwitchCase="'NOTIFICATIONS'" [data]="widget.data"></tc-notifications-widget>
      <tc-announcements-widget *ngSwitchCase="'ANNOUNCEMENTS'" [data]="widget.data"></tc-announcements-widget>
      <tc-calendar-widget *ngSwitchCase="'CALENDAR'" [data]="widget.data"></tc-calendar-widget>
      <tc-calendar-widget *ngSwitchCase="'EVENTS'" [data]="widget.data"></tc-calendar-widget>
      <tc-attendance-summary-widget *ngSwitchCase="'ATTENDANCE_SUMMARY'" [data]="widget.data"></tc-attendance-summary-widget>
      <tc-staff-attendance-toggle-widget *ngSwitchCase="'STAFF_ATTENDANCE_TOGGLE'" [data]="widget.data"></tc-staff-attendance-toggle-widget>
      <tc-fee-summary-widget *ngSwitchCase="'FEE_SUMMARY'" [data]="widget.data"></tc-fee-summary-widget>
      <tc-timetable-widget *ngSwitchCase="'TIMETABLE'" [data]="widget.data"></tc-timetable-widget>
      <tc-profile-summary-widget *ngSwitchCase="'PROFILE_SUMMARY'" [data]="widget.data"></tc-profile-summary-widget>
      <tc-child-profile-widget *ngSwitchCase="'CHILD_PROFILE'" [data]="widget.data"></tc-child-profile-widget>
      <tc-quick-actions-widget *ngSwitchCase="'QUICK_ACTIONS'" [data]="widget.data"></tc-quick-actions-widget>
      <tc-recent-records-widget *ngSwitchCase="'RECENT_RECORDS'" [data]="widget.data"></tc-recent-records-widget>
      <tc-system-health-widget *ngSwitchCase="'SYSTEM_HEALTH'" [data]="widget.data"></tc-system-health-widget>
      <tc-top-organizations-widget *ngSwitchCase="'TOP_ORGANIZATIONS'" [data]="widget.data"></tc-top-organizations-widget>
      <tc-leave-summary-widget *ngSwitchCase="'LEAVE_SUMMARY'" [data]="widget.data"></tc-leave-summary-widget>
      <tc-stat-list-widget *ngSwitchCase="'EXAMINATION_SUMMARY'" [items]="widget.data.upcoming"></tc-stat-list-widget>
      <tc-library-summary-widget *ngSwitchCase="'LIBRARY_SUMMARY'" [data]="widget.data"></tc-library-summary-widget>
      <tc-transport-summary-widget *ngSwitchCase="'TRANSPORT_SUMMARY'" [data]="widget.data"></tc-transport-summary-widget>
      <tc-support-tickets-widget *ngSwitchCase="'SUPPORT_TICKETS'" [data]="widget.data"></tc-support-tickets-widget>
    </ng-container>
  </tc-widget-card>
</ng-template>
