<div class="staff-week">
  <div class="staff-week__days" role="list" aria-label="Daily attendance this week">
    <article
      class="staff-week__day"
      role="listitem"
      *ngFor="let day of data.days"
      [attr.data-status]="day.displayStatus"
      [attr.aria-label]="(day.date | date:'EEEE, d MMMM') + ': ' + statusLabel(day)">
      <strong>{{ day.dayLabel | slice:0:3 }}</strong>
      <time [attr.datetime]="day.date">{{ day.date | date:'d MMM' }}</time>
      <span class="staff-week__status-icon" *ngIf="iconFor(day) as icon; else noStatusIcon">
        <i [class]="icon" aria-hidden="true"></i>
      </span>
      <ng-template #noStatusIcon><span class="staff-week__status-dash">—</span></ng-template>
    </article>
  </div>

  <div class="staff-week__summary">
    <div
      class="staff-week__ring"
      [style.--attendance-percent]="data.attendancePercent + '%'"
      role="img"
      [attr.aria-label]="'Weekly attendance ' + data.attendancePercent + ' percent'">
      <strong>{{ data.attendancePercent }}%</strong>
    </div>
    <p *ngIf="data.applicableDays; else noApplicableDays">
      {{ data.attendedDayEquivalent | number:'1.0-1' }} of {{ data.applicableDays }} working days
    </p>
    <ng-template #noApplicableDays><p>No applicable workdays this week</p></ng-template>
  </div>
</div>
