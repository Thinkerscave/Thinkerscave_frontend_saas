<section class="sd-workspace">
  <tc-saas-page-header>
    <button type="button" class="sd-btn sd-btn--primary" disabled title="Coming soon">
      <i class="pi pi-plus"></i> New Leave Request
    </button>
  </tc-saas-page-header>

  <div class="sd-kpi-row">
    @for (kpi of kpis; track kpi.label) {
      <div class="sd-kpi-card" [attr.data-color]="kpi.color">
        <div class="sd-kpi-card__icon"><i class="pi" [ngClass]="kpi.icon"></i></div>
        <div class="sd-kpi-card__body">
          <span class="sd-kpi-card__value">{{ kpi.value }}</span>
          <span class="sd-kpi-card__label">{{ kpi.label }}</span>
        </div>
      </div>
    }
  </div>

  <div class="sd-tabs-leave">
    <button type="button" class="is-active">Leave Requests</button>
    <button type="button" disabled>My Leave</button>
  </div>

  <div class="sd-empty sd-empty--card">
    <i class="pi pi-calendar-times"></i>
    <h3>Leave module integration in progress</h3>
    <p>
      Full leave request workflows will connect to the HR attendance module.
      Until then, use <a routerLink="/app/attendance/staff">Staff Attendance</a> for daily availability tracking.
    </p>
  </div>
</section>
