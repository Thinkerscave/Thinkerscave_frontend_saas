<div class="saas-page roles-list">
  <tc-saas-page-header>
    <button type="button" class="tc-btn tc-btn--primary" (click)="openCreate()"><i class="pi pi-plus"></i> New Role</button>
  </tc-saas-page-header>

  <app-toast></app-toast>

  <div *ngIf="errorMessage" class="saas-empty"><i class="pi pi-exclamation-triangle"></i><strong>{{ errorMessage }}</strong></div>
  <div *ngIf="loading" class="saas-loading"><i class="pi pi-spin pi-spinner"></i> Loading roles...</div>

  <ng-container *ngIf="!loading">
    <tc-saas-stat-grid [stats]="stats"></tc-saas-stat-grid>

    <tc-saas-panel *ngIf="createOpen" title="Create Role" subtitle="Use ROLE_ prefix for role codes">
      <div class="roles-list__form">
        <label class="saas-field"><span>Role Code</span><input [(ngModel)]="draft.roleCode" placeholder="ROLE_COORDINATOR"></label>
        <label class="saas-field"><span>Role Name</span><input [(ngModel)]="draft.roleName" placeholder="Academic Coordinator"></label>
        <label class="saas-field"><span>Role Type</span>
          <p-dropdown
            [options]="roleTypeOptions"
            [(ngModel)]="draft.roleType"
            optionLabel="label"
            optionValue="value"
            appendTo="body"
            styleClass="att-filter-dropdown">
          </p-dropdown>
        </label>
        <label class="saas-field"><span>Description</span><input [(ngModel)]="draft.description" placeholder="Optional description"></label>
        <div class="roles-list__form-actions">
          <button type="button" class="tc-btn" (click)="closeCreate()">Cancel</button>
          <button type="button" class="tc-btn tc-btn--primary" [disabled]="saving" (click)="submitCreate()">
            <i class="pi" [ngClass]="saving ? 'pi-spin pi-spinner' : 'pi-save'"></i> Save Role
          </button>
        </div>
      </div>
    </tc-saas-panel>

    <tc-saas-panel title="All Roles" [subtitle]="filtered.length + ' roles'">
      <div class="roles-list__toolbar">
        <input type="search" class="saas-search" [ngModel]="search" (ngModelChange)="onSearchChange($event)" placeholder="Search roles...">
      </div>
      <div class="saas-table-wrap">
        <table class="saas-data-table">
          <thead>
            <tr><th>Role</th><th>Type</th><th>Users</th><th>Status</th><th></th></tr>
          </thead>
          <tbody>
            <tr *ngFor="let r of paged; trackBy: trackById" (click)="openWorkspace(r)" class="roles-list__row">
              <td><strong>{{ r.roleName }}</strong><br><code>{{ r.roleCode }}</code></td>
              <td>{{ roleTypeLabel(r.roleType) }}</td>
              <td>{{ r.activeUserCount ?? 0 }}</td>
              <td>
                <tc-saas-pill [label]="r.active === false ? 'Inactive' : 'Active'" [tone]="r.active === false ? 'danger' : 'success'"></tc-saas-pill>
                <tc-saas-pill *ngIf="r.systemRole" label="System" tone="info"></tc-saas-pill>
              </td>
              <td>
                <button type="button" class="saas-icon-btn" (click)="$event.stopPropagation(); openWorkspace(r)" title="Permissions"><i class="pi pi-key"></i></button>
                <button type="button" class="saas-icon-btn" *ngIf="!r.systemRole" (click)="$event.stopPropagation(); toggleActive(r)" title="Toggle status"><i class="pi pi-power-off"></i></button>
              </td>
            </tr>
            <tr *ngIf="!filtered.length"><td colspan="5" class="empty">No roles found.</td></tr>
          </tbody>
        </table>
      </div>
      <app-paginator
        *ngIf="filtered.length"
        [page]="page"
        [rows]="pageSize"
        [totalRecords]="filtered.length"
        [pageSizeOptions]="pageSizeOptions"
        noun="roles"
        (pageChange)="onPageChange($event)">
      </app-paginator>
    </tc-saas-panel>
  </ng-container>
</div>
