<div class="saas-page access-dashboard">
  <tc-saas-page-header>
    <button type="button" class="tc-btn" (click)="load()" [disabled]="loading"><i class="pi pi-refresh"></i> Refresh</button>
  </tc-saas-page-header>

  <div *ngIf="errorMessage" class="saas-empty" role="alert">
    <i class="pi pi-exclamation-triangle"></i><strong>{{ errorMessage }}</strong>
    <button type="button" class="tc-btn tc-btn--primary" (click)="load()">Retry</button>
  </div>

  <div *ngIf="loading && !errorMessage" class="saas-loading"><i class="pi pi-spin pi-spinner"></i> Loading access overview...</div>

  <ng-container *ngIf="!loading && !errorMessage">
    <tc-saas-stat-grid [stats]="stats"></tc-saas-stat-grid>

    <div class="access-dashboard__actions">
      <tc-saas-panel title="Organization access" subtitle="You manage users and responsibilities. Platform roles and menu definitions stay with ThinkersCave.">
        <div class="access-dashboard__grid">
          <button type="button" class="access-dashboard__action" (click)="navigate('/app/access-management/users')">
            <i class="pi pi-users"></i><span>Users</span><small>Lock, unlock and reset passwords</small>
          </button>
          <button type="button" class="access-dashboard__action" (click)="navigate('/app/access-management/responsibilities')">
            <i class="pi pi-sitemap"></i><span>Responsibilities</span><small>Create and assign menus</small>
          </button>
          <button type="button" class="access-dashboard__action" (click)="navigate('/app/access-management/menus')">
            <i class="pi pi-th-large"></i><span>Menu catalog</span><small>View menus you can assign</small>
          </button>
          <button type="button" class="access-dashboard__action" (click)="navigate('/app/access-management/login-history')">
            <i class="pi pi-history"></i><span>Login history</span><small>Sign-in audit for this school</small>
          </button>
          <button type="button" class="access-dashboard__action" (click)="navigate('/app/access-management/security-policy')">
            <i class="pi pi-shield"></i><span>Security policy</span><small>Password and lockout rules</small>
          </button>
        </div>
      </tc-saas-panel>

      <tc-saas-panel title="Responsibilities" subtitle="Click a responsibility to assign menus and submenus.">
        <div class="access-roles" *ngIf="responsibilities.length; else noItems">
          <article
            class="access-roles__item"
            *ngFor="let item of responsibilities; trackBy: trackById"
            (click)="openResponsibility(item)">
            <div class="access-roles__head">
              <div>
                <strong>{{ item.responsibilityName }}</strong>
                <code>{{ item.responsibilityCode }}</code>
              </div>
              <small>{{ item.active === false ? 'Inactive' : 'Active' }}</small>
            </div>
          </article>
        </div>
        <ng-template #noItems><p>No responsibilities yet. Create one to start assigning menus.</p></ng-template>
      </tc-saas-panel>
    </div>
  </ng-container>
</div>
