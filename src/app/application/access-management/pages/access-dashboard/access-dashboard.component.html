<div class="saas-page access-dashboard">
  <tc-saas-page-header>
    <button type="button" class="tc-btn" (click)="load()" [disabled]="loading"><i class="pi pi-refresh"></i> Refresh</button>
  </tc-saas-page-header>

  <div *ngIf="errorMessage" class="saas-empty" role="alert">
    <i class="pi pi-exclamation-triangle"></i><strong>{{ errorMessage }}</strong>
    <button type="button" class="tc-btn tc-btn--primary" (click)="load()">Retry</button>
  </div>

  <div *ngIf="loading && !errorMessage" class="saas-loading"><i class="pi pi-spin pi-spinner"></i> Loading access overview...</div>

  <ng-container *ngIf="!loading && !errorMessage">
    <tc-saas-stat-grid [stats]="stats"></tc-saas-stat-grid>

    <div class="access-dashboard__actions">
      <tc-saas-panel title="Quick Actions" subtitle="Common access administration tasks">
        <div class="access-dashboard__grid">
          <button type="button" class="access-dashboard__action" (click)="navigate('/app/access-management/users')">
            <i class="pi pi-users"></i><span>User Access</span><small>Assign roles and custom overrides</small>
          </button>
          <button type="button" class="access-dashboard__action" (click)="navigate('/app/access-management/security-policy')">
            <i class="pi pi-shield"></i><span>Security Policy</span><small>Password rules and session controls</small>
          </button>
          <button type="button" class="access-dashboard__action" (click)="navigate('/app/access-management/login-history')">
            <i class="pi pi-history"></i><span>Login History</span><small>Audit sign-in activity</small>
          </button>
        </div>
      </tc-saas-panel>

      <tc-saas-panel title="Roles" subtitle="Click a role to see assigned users. Assign or remove people from User Access.">
        <div class="access-roles" *ngIf="roles.length; else noRoles">
          <article
            class="access-roles__item"
            *ngFor="let role of roles"
            [class.is-open]="selectedRole?.id === role.id"
            (click)="selectRole(role)">
            <div class="access-roles__head">
              <div>
                <strong>{{ role.roleName }}</strong>
                <code>{{ role.roleCode }}</code>
              </div>
              <small>{{ role.activeUserCount ?? 0 }} users</small>
            </div>
            <div class="access-roles__users" *ngIf="selectedRole?.id === role.id" (click)="$event.stopPropagation()">
              <p *ngIf="loadingUsers">Loading users…</p>
              <div *ngIf="!loadingUsers && roleUsers.length">
                <div class="access-roles__user" *ngFor="let user of roleUsers">
                  <div>
                    <strong>{{ userDisplayName(user) }}</strong>
                    <small>{{ user.email || user.username }}</small>
                  </div>
                </div>
              </div>
              <p *ngIf="!loadingUsers && !roleUsers.length">No users have this role yet.</p>
              <a class="access-roles__link" routerLink="/app/access-management/users">Open users</a>
            </div>
          </article>
        </div>
        <ng-template #noRoles><p>No roles available in this organization.</p></ng-template>
      </tc-saas-panel>
    </div>
  </ng-container>
</div>
