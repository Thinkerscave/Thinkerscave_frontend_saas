<p-dialog
  header="Record Payment"
  [(visible)]="visible"
  (visibleChange)="visibleChange.emit($event)"
  [modal]="true"
  [draggable]="false"
  [style]="{ width: '540px', maxWidth: '95vw' }"
  (onHide)="visibleChange.emit(false)">
  <form [formGroup]="form" class="payroll-dialog-form" (ngSubmit)="submit()">
    @if (employee) {
      <div class="payroll-dialog-employee">
        <strong>{{ employee.employeeName }}</strong>
        <span>
          Net {{ formatMoney(employee.netAmount) }}
          @if (remaining != null) { · Remaining {{ formatMoney(remaining) }} }
        </span>
      </div>
    }

    <div class="tc-form-field">
      <label>Amount *</label>
      <input type="number" min="0.01" step="0.01" formControlName="amount" />
    </div>
    <div class="tc-form-field">
      <label>Paid On *</label>
      <input type="datetime-local" formControlName="paidOn" />
    </div>
    <div class="tc-form-field">
      <label>Payment Method *</label>
      <select formControlName="paymentMethodId">
        <option [ngValue]="null" disabled>Select method</option>
        @for (m of methods; track m.feePaymentMethodId) {
          <option [ngValue]="m.feePaymentMethodId">{{ m.name }}</option>
        }
      </select>
    </div>
    <div class="tc-form-field">
      <label>Reference</label>
      <input formControlName="reference" />
    </div>
    <div class="tc-form-field">
      <label>Remarks</label>
      <textarea rows="2" formControlName="remarks"></textarea>
    </div>

    <div class="payroll-dialog-actions">
      <button type="button" class="tc-btn tc-btn--outline" (click)="close()" [disabled]="saving">Cancel</button>
      <button type="submit" class="tc-btn tc-btn--primary" [disabled]="saving || form.invalid || !employeePayrollId">
        @if (saving) { <i class="pi pi-spin pi-spinner"></i> }
        Record Payment
      </button>
    </div>
  </form>
</p-dialog>
