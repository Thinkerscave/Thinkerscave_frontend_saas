<div class="saas-page feature-catalog">
  <tc-saas-page-header>
    <button type="button" class="saas-btn" (click)="load()" [disabled]="loading"><i class="pi pi-refresh"></i> Refresh</button>
    <button type="button" class="saas-btn" (click)="reset()"><i class="pi pi-filter-slash"></i> Reset Filters</button>
  </tc-saas-page-header>

  <div *ngIf="errorMessage" class="saas-empty"><i class="pi pi-exclamation-triangle"></i><strong>{{ errorMessage }}</strong></div>
  <div *ngIf="loading" class="saas-loading"><i class="pi pi-spin pi-spinner"></i> Loading features...</div>

  <ng-container *ngIf="!loading">
    <tc-saas-stat-grid [stats]="stats()"></tc-saas-stat-grid>

    <tc-saas-panel title="Catalogue" subtitle="Features available for subscription plans and overrides">
      <tc-saas-filter-row>
        <label class="saas-search"><i class="pi pi-search"></i>
          <input type="search" placeholder="Search by name or code" [ngModel]="search()" (ngModelChange)="search.set($event)">
        </label>
        <label class="saas-field"><span>Category</span>
          <select [ngModel]="categoryFilter()" (ngModelChange)="categoryFilter.set($event)">
            <option *ngFor="let c of categories()" [value]="c">{{ c === 'all' ? 'All categories' : c }}</option>
          </select>
        </label>
      </tc-saas-filter-row>

      <div class="saas-table-wrap">
        <table class="saas-data-table">
          <thead>
            <tr>
              <th>Feature</th>
              <th>Module</th>
              <th>Category</th>
              <th>Description</th>
              <th>Type</th>
            </tr>
          </thead>
          <tbody>
            <tr *ngFor="let m of filtered()">
              <td>
                <div class="module-cell">
                  <strong>{{ m.displayName || m.featureName }}</strong>
                  <small>{{ m.featureCode }}</small>
                </div>
              </td>
              <td>{{ m.module || '—' }}</td>
              <td>{{ m.category || '—' }}</td>
              <td class="muted">{{ m.description || '—' }}</td>
              <td>
                <tc-saas-pill
                  [label]="m.premiumFeature ? 'Premium' : (m.defaultEnabled ? 'Core' : 'Optional')"
                  [tone]="pillTone(m)">
                </tc-saas-pill>
              </td>
            </tr>
            <tr *ngIf="!filtered().length">
              <td colspan="5" class="empty">No features match the current filters.</td>
            </tr>
          </tbody>
        </table>
      </div>
    </tc-saas-panel>
  </ng-container>
</div>
