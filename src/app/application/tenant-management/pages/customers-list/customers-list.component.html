<div class="customers-list">
<p-menu #rowMenu [model]="menuItems" [popup]="true" appendTo="body"></p-menu>

  <tc-saas-page-header>
    <app-button variant="ghost" icon="pi pi-download" (clicked)="exportCustomers()">Export</app-button>
    <app-button variant="secondary" icon="pi pi-refresh" [loading]="loading" (clicked)="load()">Refresh</app-button>
    <app-button variant="primary" icon="pi pi-plus" (clicked)="addCustomer()">Add Customer</app-button>
  </tc-saas-page-header>

  <!-- Summary stats -->
  <section class="customers-list__stats" *ngIf="!loading || dashboard">
    <ng-container *ngIf="loading && !dashboard">
      <app-skeleton-loader variant="stat"></app-skeleton-loader>
      <app-skeleton-loader variant="stat"></app-skeleton-loader>
      <app-skeleton-loader variant="stat"></app-skeleton-loader>
      <app-skeleton-loader variant="stat"></app-skeleton-loader>
    </ng-container>
    <ng-container *ngIf="dashboard">
      <app-stat-card
        icon="pi pi-users"
        tone="primary"
        [value]="dashboard.totalCustomers"
        label="Total Customers">
      </app-stat-card>
      <app-stat-card
        icon="pi pi-building"
        tone="info"
        [value]="dashboard.totalOrganizations"
        label="Total Organizations">
      </app-stat-card>
      <app-stat-card
        icon="pi pi-clock"
        tone="success"
        [value]="dashboard.trialCustomers"
        label="Active Trials">
      </app-stat-card>
      <app-stat-card
        icon="pi pi-wallet"
        tone="primary"
        [value]="formatCurrency(dashboard.annualRevenue)"
        label="Total Revenue">
      </app-stat-card>
    </ng-container>
  </section>

  <!-- Filters -->
  <app-list-toolbar
    [search]="search"
    searchPlaceholder="Search customers…"
    [searching]="refreshing"
    [view]="viewMode"
    viewAriaLabel="Customers view"
    (searchChange)="onSearchChange($event)"
    (searchDebounced)="applyQuery()"
    (submitted)="applyFilters()"
    (reset)="resetFilters()"
    (viewChange)="onViewModeChange($event)">
    <label class="customers-list__filter">
      <span class="customers-list__filter-label">Sort By</span>
      <p-dropdown
        [options]="sortOptions"
        [(ngModel)]="sortBy"
        optionLabel="label"
        optionValue="value"
        appendTo="body"
        styleClass="att-filter-dropdown">
      </p-dropdown>
    </label>

    <label class="customers-list__filter">
      <span class="customers-list__filter-label">Status</span>
      <p-dropdown
        [options]="statusOptions"
        [(ngModel)]="statusFilter"
        optionLabel="label"
        optionValue="value"
        appendTo="body"
        styleClass="att-filter-dropdown">
      </p-dropdown>
    </label>

    <label class="customers-list__filter">
      <span class="customers-list__filter-label">Created</span>
      <p-dropdown
        [options]="createdOptions"
        [(ngModel)]="createdFilter"
        optionLabel="label"
        optionValue="value"
        appendTo="body"
        styleClass="att-filter-dropdown">
      </p-dropdown>
    </label>
  </app-list-toolbar>

  <!-- Content panel -->
  <section class="customers-list__panel">
    <app-list-results [busy]="refreshing">
    <app-list-empty-state
      *ngIf="errorMessage && hasLoaded"
      icon="pi pi-exclamation-triangle"
      title="Something went wrong"
      [description]="errorMessage"
      actionLabel="Retry"
      actionIcon="pi pi-refresh"
      (actionClick)="load()">
    </app-list-empty-state>

    <ng-container *ngIf="!hasLoaded && loading">
      <app-skeleton-group
        [variant]="effectiveViewMode === 'table' ? 'row' : 'card'"
        [layout]="effectiveViewMode === 'grid' ? 'grid' : 'stack'"
        [count]="6">
      </app-skeleton-group>
    </ng-container>

    <app-list-empty-state
      *ngIf="hasLoaded && !errorMessage && !customers.length"
      icon="pi pi-users"
      title="No customers yet"
      description="Create your first customer account to start managing organizations."
      actionLabel="Add Customer"
      actionIcon="pi pi-plus"
      (actionClick)="addCustomer()">
    </app-list-empty-state>

    <div
      *ngIf="!errorMessage && customers.length && effectiveViewMode === 'grid'"
      class="customers-list__grid">
      <app-customer-card
        *ngFor="let c of customers; trackBy: trackById"
        [customer]="toCardData(c)"
        (cardClick)="openCustomer(c)">
      </app-customer-card>
    </div>

    <!-- Table view -->
    <div
      *ngIf="!errorMessage && customers.length && effectiveViewMode === 'table'"
      class="customers-list__table-wrap">
      <table class="customers-list__table">
        <thead>
          <tr>
            <th>Customer</th>
            <th>Organizations</th>
            <th>Owner</th>
            <th>Status</th>
            <th>Created On</th>
            <th>Last Activity</th>
            <th class="customers-list__actions-col">Actions</th>
          </tr>
        </thead>
        <tbody>
          <tr
            *ngFor="let c of customers; trackBy: trackById"
            class="customers-list__row"
            (click)="openCustomer(c)">
            <td>
              <div class="customers-list__customer-cell">
                <app-avatar [name]="c.customerName" [logoUrl]="c.logoUrl ?? null" size="sm"></app-avatar>
                <div>
                  <strong>{{ c.customerName }}</strong>
                  <small>{{ c.domain || c.customerCode }}</small>
                </div>
              </div>
            </td>
            <td>
              <button
                type="button"
                class="customers-list__org-link"
                (click)="openOrganizations(c, $event)">
                {{ c.organizationCount ?? 0 }}
              </button>
            </td>
            <td>
              <div class="customers-list__owner-cell">
                <span>{{ c.ownerName || '—' }}</span>
                <small *ngIf="c.ownerEmail">{{ c.ownerEmail }}</small>
              </div>
            </td>
            <td>
              <app-status-badge [status]="c.status || ''"></app-status-badge>
            </td>
            <td>{{ formatDate(c.createdDate) }}</td>
            <td>{{ c.lastActivity || formatDate(c.lastActivityAt) }}</td>
            <td class="customers-list__actions-col">
              <button
                type="button"
                class="customers-list__menu-btn"
                aria-label="Customer actions"
                (click)="openRowMenu(c, $event)">
                <i class="pi pi-ellipsis-v" aria-hidden="true"></i>
              </button>
            </td>
          </tr>
        </tbody>
      </table>
    </div>

    <!-- Pagination -->
    </app-list-results>

    <app-paginator
      *ngIf="!errorMessage && totalRecords > 0"
      [page]="page"
      [rows]="pageSize"
      [totalRecords]="totalRecords"
      [pageSizeOptions]="pageSizeOptions"
      noun="results"
      (pageChange)="onPageChange($event)">
    </app-paginator>
  </section>
</div>
