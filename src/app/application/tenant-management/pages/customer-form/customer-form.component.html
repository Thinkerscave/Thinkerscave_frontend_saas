<div class="customer-form-page">
<div class="customer-form-page__shell">
    <tc-saas-page-header>
      <app-back-nav
        [fallback]="backFallback"
        [label]="isEditMode ? 'Back to customer' : 'Back to customers'">
      </app-back-nav>
      <app-button
        variant="primary"
        [icon]="isEditMode ? 'pi pi-check' : 'pi pi-plus'"
        [loading]="submitting"
        [disabled]="!canSubmit"
        (clicked)="submit()">
        {{ isEditMode ? 'Save Changes' : 'Create Customer' }}
      </app-button>
    </tc-saas-page-header>

    <div *ngIf="errorMessage" class="customer-form-page__banner" role="alert">
      <i class="pi pi-exclamation-triangle" aria-hidden="true"></i>
      <span>{{ errorMessage }}</span>
    </div>

    <app-loader *ngIf="loading" label="Loading customer…"></app-loader>

    <app-card *ngIf="!loading" [hasFooter]="true" [elevated]="true">
      <form class="customer-form" novalidate (submit)="$event.preventDefault()">
        <section class="customer-form__section">
          <app-section-header
            title="1. Business Information"
            description="Basic identity details of the customer account."
            icon="pi pi-id-card">
          </app-section-header>

          <div class="customer-form__grid">
            <app-input
              label="Customer Name"
              placeholder="Enter customer name"
              [required]="true"
              autocomplete="organization"
              [(ngModel)]="form.customerName"
              name="customerName"
              [error]="fieldError('customerName')"
              (ngModelChange)="onFieldChange('customerName')">
            </app-input>

            <app-input
              label="Business Email"
              type="email"
              placeholder="Enter business email"
              [required]="true"
              autocomplete="email"
              inputMode="email"
              [(ngModel)]="form.businessEmail"
              name="businessEmail"
              [error]="fieldError('businessEmail')"
              (ngModelChange)="onFieldChange('businessEmail')">
            </app-input>

            <app-phone-input
              label="Mobile Number"
              placeholder="Enter mobile number"
              [required]="true"
              [(ngModel)]="form.mobileNumber"
              name="mobileNumber"
              [error]="fieldError('mobileNumber')"
              (ngModelChange)="onFieldChange('mobileNumber')">
            </app-phone-input>

            <app-phone-input
              label="Alternate Mobile Number"
              placeholder="Enter alternate mobile number (optional)"
              [(ngModel)]="form.alternateMobileNumber"
              name="alternateMobileNumber"
              [error]="fieldError('alternateMobileNumber')"
              (ngModelChange)="onFieldChange('alternateMobileNumber')">
            </app-phone-input>
          </div>
        </section>

        <section class="customer-form__section">
          <app-section-header
            title="2. Primary Contact"
            description="Primary point of contact for this customer."
            icon="pi pi-user">
          </app-section-header>

          <div class="customer-form__grid">
            <app-input
              label="Full Name"
              placeholder="Enter full name"
              [required]="true"
              autocomplete="name"
              [(ngModel)]="form.primary.fullName"
              name="primaryFullName"
              [error]="fieldError('primary.fullName')"
              (ngModelChange)="onFieldChange('primary.fullName')">
            </app-input>

            <app-input
              label="Email Address"
              type="email"
              placeholder="Enter email address"
              [required]="true"
              autocomplete="email"
              inputMode="email"
              [(ngModel)]="form.primary.email"
              name="primaryEmail"
              [error]="fieldError('primary.email')"
              (ngModelChange)="onFieldChange('primary.email')">
            </app-input>

            <app-phone-input
              label="Mobile Number"
              placeholder="Enter mobile number"
              [required]="true"
              [(ngModel)]="form.primary.mobileNumber"
              name="primaryMobile"
              [error]="fieldError('primary.mobileNumber')"
              (ngModelChange)="onFieldChange('primary.mobileNumber')">
            </app-phone-input>

            <app-input
              label="Designation"
              placeholder="Enter designation (optional)"
              autocomplete="organization-title"
              [(ngModel)]="form.primary.designation"
              name="primaryDesignation"
              [error]="fieldError('primary.designation')"
              (ngModelChange)="onFieldChange('primary.designation')">
            </app-input>
          </div>
        </section>

        <section class="customer-form__section">
          <app-section-header
            title="3. Secondary Contact (Optional)"
            description="Backup contact for this customer."
            icon="pi pi-users">
          </app-section-header>

          <div class="customer-form__grid">
            <app-input
              label="Full Name"
              placeholder="Enter full name (optional)"
              autocomplete="name"
              [(ngModel)]="form.secondary.fullName"
              name="secondaryFullName"
              [error]="fieldError('secondary.fullName')"
              (ngModelChange)="onFieldChange('secondary.fullName')">
            </app-input>

            <app-input
              label="Email Address"
              type="email"
              placeholder="Enter email address (optional)"
              autocomplete="email"
              inputMode="email"
              [(ngModel)]="form.secondary.email"
              name="secondaryEmail"
              [error]="fieldError('secondary.email')"
              (ngModelChange)="onFieldChange('secondary.email')">
            </app-input>

            <app-phone-input
              label="Mobile Number"
              placeholder="Enter mobile number (optional)"
              [(ngModel)]="form.secondary.mobileNumber"
              name="secondaryMobile"
              [error]="fieldError('secondary.mobileNumber')"
              (ngModelChange)="onFieldChange('secondary.mobileNumber')">
            </app-phone-input>

            <app-input
              label="Designation"
              placeholder="Enter designation (optional)"
              autocomplete="organization-title"
              [(ngModel)]="form.secondary.designation"
              name="secondaryDesignation"
              [error]="fieldError('secondary.designation')"
              (ngModelChange)="onFieldChange('secondary.designation')">
            </app-input>
          </div>
        </section>

        <section class="customer-form__section customer-form__section--notes">
          <app-section-header
            title="4. Notes (Optional)"
            description="Add any internal notes for future reference."
            icon="pi pi-book">
          </app-section-header>

          <app-textarea
            label="Notes"
            placeholder="Enter notes, onboarding context, or special terms (optional)"
            [rows]="3"
            [compact]="true"
            [maxLength]="notesMax"
            [(ngModel)]="form.notes"
            name="notes"
            [error]="fieldError('notes')"
            (ngModelChange)="onFieldChange('notes')">
          </app-textarea>
        </section>
      </form>

      <div card-footer class="customer-form-page__footer">
        <app-button variant="secondary" [disabled]="submitting" (clicked)="cancel()">
          Cancel
        </app-button>
        <app-button
          variant="primary"
          icon="pi pi-plus"
          [loading]="submitting"
          [disabled]="!canSubmit"
          (clicked)="submit()">
          {{ isEditMode ? 'Save Changes' : 'Create Customer' }}
        </app-button>
      </div>
    </app-card>
  </div>
</div>
