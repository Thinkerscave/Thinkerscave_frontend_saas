<app-workspace-header
    title="Exams"
    subtitle="Examination management"
    description="Schedule exams, capture marks and publish results."
    icon="pi pi-file-edit"
    [breadcrumbs]="[{ label: 'Academics' }, { label: 'Exams' }]">
    <ng-container actions>
        <p-button label="New exam" icon="pi pi-plus" routerLink="/app/exams/new"></p-button>
    </ng-container>
</app-workspace-header>

<section class="tc-kpi-strip">
    <app-kpi-card label="Total exams"  [value]="exams().length"          icon="pi pi-list"         tone="info"></app-kpi-card>
    <app-kpi-card label="Scheduled"    [value]="countBy('SCHEDULED')"    icon="pi pi-calendar"     tone="info"></app-kpi-card>
    <app-kpi-card label="In progress"  [value]="countBy('IN_PROGRESS')"  icon="pi pi-spinner"      tone="warning"></app-kpi-card>
    <app-kpi-card label="Published"    [value]="countBy('PUBLISHED')"    icon="pi pi-check-circle" tone="success"></app-kpi-card>
</section>

<section class="tc-card">
    <ng-container *ngIf="loading(); else loaded">
        <app-skeleton shape="table" [rows]="6" [columns]="6"></app-skeleton>
    </ng-container>

    <ng-template #loaded>
        <ng-container *ngIf="exams().length; else empty">
            <p-table [value]="exams()" [paginator]="true" [rows]="10"
                     styleClass="p-datatable-sm" responsiveLayout="scroll">
                <ng-template pTemplate="header">
                    <tr>
                        <th>Date</th>
                        <th>Class</th>
                        <th>Subject</th>
                        <th>Max marks</th>
                        <th>Status</th>
                        <th class="tc-col-actions"></th>
                    </tr>
                </ng-template>
                <ng-template pTemplate="body" let-row>
                    <tr>
                        <td>{{ row.examDate | date: 'mediumDate' }}</td>
                        <td>{{ row.classId }}</td>
                        <td>{{ row.subjectId }}</td>
                        <td>{{ row.maxMarks }}</td>
                        <td><app-status-badge [status]="row.status"></app-status-badge></td>
                        <td class="tc-row-actions">
                            <p-button icon="pi pi-pencil"     [text]="true" size="small" pTooltip="Edit"
                                      [routerLink]="['/app/exams', row.id, 'edit']"></p-button>
                            <p-button icon="pi pi-list"       [text]="true" size="small" pTooltip="Marks"
                                      [routerLink]="['/app/exams', row.id, 'marks']"></p-button>
                            <p-button icon="pi pi-chart-bar"  [text]="true" size="small" pTooltip="Results"
                                      [routerLink]="['/app/exams', row.id, 'results']"></p-button>
                        </td>
                    </tr>
                </ng-template>
            </p-table>
        </ng-container>

        <ng-template #empty>
            <app-empty-state
                icon="pi pi-file-edit"
                title="No exams yet"
                message="Create your first exam to start scheduling and publishing results."
                actionLabel="Create exam"
                actionIcon="pi pi-plus"
                (action)="router.navigate(['/app/exams/new'])"></app-empty-state>
        </ng-template>
    </ng-template>
</section>
