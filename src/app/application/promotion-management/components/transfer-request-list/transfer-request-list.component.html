<app-workspace-header
    title="Transfer requests"
    subtitle="Student movement"
    description="Approve transfers, reject requests and issue transfer certificates."
    icon="pi pi-send"
    [breadcrumbs]="[{ label: 'Students' }, { label: 'Transfers' }]">
    <ng-container actions>
        <p-button label="New request" icon="pi pi-plus"
                  (onClick)="router.navigate(['/app/transfers/new'])"></p-button>
    </ng-container>
</app-workspace-header>

<section class="tc-kpi-strip">
    <app-kpi-card label="Pending"   [value]="countBy('REQUESTED')"           icon="pi pi-clock"        tone="warning"></app-kpi-card>
    <app-kpi-card label="Approved"  [value]="countBy('APPROVED')"            icon="pi pi-check"        tone="info"></app-kpi-card>
    <app-kpi-card label="Issued"    [value]="countBy('CERTIFICATE_ISSUED')"  icon="pi pi-verified"     tone="success"></app-kpi-card>
    <app-kpi-card label="Rejected"  [value]="countBy('REJECTED')"            icon="pi pi-times-circle" tone="danger"></app-kpi-card>
</section>

<section class="tc-card">
    <ng-container *ngIf="loading(); else loaded">
        <app-skeleton shape="table" [rows]="6" [columns]="6"></app-skeleton>
    </ng-container>

    <ng-template #loaded>
        <ng-container *ngIf="requests().length; else empty">
            <p-table [value]="requests()" [paginator]="true" [rows]="10"
                     styleClass="p-datatable-sm" responsiveLayout="scroll">
                <ng-template pTemplate="header">
                    <tr>
                        <th>Transfer #</th>
                        <th>Student</th>
                        <th>Reason</th>
                        <th>Status</th>
                        <th>Certificate</th>
                        <th>Requested</th>
                        <th style="width: 12rem"></th>
                    </tr>
                </ng-template>
                <ng-template pTemplate="body" let-row>
                    <tr>
                        <td>{{ row.transferNumber || row.id }}</td>
                        <td>{{ row.studentId }}</td>
                        <td>{{ row.reason || '—' }}</td>
                        <td><app-status-badge [status]="row.status"></app-status-badge></td>
                        <td>{{ row.certificateNumber || '—' }}</td>
                        <td>{{ row.createdAt ? (row.createdAt | date: 'medium') : '—' }}</td>
                        <td class="tc-row-actions">
                            <p-button *ngIf="row.status === 'REQUESTED'"
                                      icon="pi pi-check" [text]="true" size="small"
                                      pTooltip="Approve" (onClick)="approve(row)"></p-button>
                            <p-button *ngIf="row.status === 'REQUESTED'"
                                      icon="pi pi-times" [text]="true" size="small"
                                      pTooltip="Reject" (onClick)="reject(row)"></p-button>
                            <p-button *ngIf="row.status === 'APPROVED'"
                                      icon="pi pi-verified" [text]="true" size="small"
                                      pTooltip="Issue certificate" (onClick)="issue(row)"></p-button>
                        </td>
                    </tr>
                </ng-template>
            </p-table>
        </ng-container>

        <ng-template #empty>
            <app-empty-state
                icon="pi pi-send"
                title="No transfer requests"
                message="Initiate a transfer request to move a student to another institution."
                actionLabel="New request"
                actionIcon="pi pi-plus"
                (action)="router.navigate(['/app/transfers/new'])"></app-empty-state>
        </ng-template>
    </ng-template>
</section>

<p-confirmDialog></p-confirmDialog>
