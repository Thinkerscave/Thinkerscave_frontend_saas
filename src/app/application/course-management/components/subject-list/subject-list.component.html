<div class="card p-4">
    <p-tabs [value]="activeTabIndex.toString()" (valueChange)="activeTabIndex = +$event">
        <p-tablist>
            <p-tab value="0">Add Subject</p-tab>
            <p-tab value="1">View Subjects</p-tab>
        </p-tablist>

        <p-tabpanels>
            <p-tabpanel value="0">
                <div class="p-fluid mt-4 max-w-4xl">
                    <div class="field mb-4">
                        <label for="addSubjectName" class="font-semibold">Subject Name</label>
                        <input type="text" pInputText id="addSubjectName" [(ngModel)]="addSubjectObj.subjectName"
                            required autofocus placeholder="e.g. Applied Physics" />
                        <small class="p-error" *ngIf="submitted && !addSubjectObj.subjectName">Name is required.</small>
                    </div>
                    <div class="field mb-4">
                        <label for="addSubjectCode" class="font-semibold">Subject Code</label>
                        <input type="text" pInputText id="addSubjectCode" [(ngModel)]="addSubjectObj.subjectCode"
                            required placeholder="e.g. PHY-101" />
                        <small class="p-error" *ngIf="submitted && !addSubjectObj.subjectCode">Code is required.</small>
                    </div>

                    <div class="formgrid grid mb-4 gap-4">
                        <div class="field col">
                            <label for="addCategory" class="font-semibold">Category</label>
                            <input type="text" pInputText id="addCategory" [(ngModel)]="addSubjectObj.category"
                                placeholder="e.g. CORE" />
                        </div>
                        <div class="field col">
                            <label for="addCredits" class="font-semibold">Credits</label>
                            <p-inputNumber id="addCredits" [(ngModel)]="addSubjectObj.credits" [min]="0"
                                [max]="20"></p-inputNumber>
                        </div>
                    </div>

                    <div class="formgrid grid mb-4 gap-4">
                        <div class="field col">
                            <label for="addTheory" class="font-semibold">Theory Hrs</label>
                            <p-inputNumber id="addTheory" [(ngModel)]="addSubjectObj.theoryHours" [min]="0"
                                suffix=" hrs"></p-inputNumber>
                        </div>
                        <div class="field col">
                            <label for="addLab" class="font-semibold">Lab Hrs</label>
                            <p-inputNumber id="addLab" [(ngModel)]="addSubjectObj.labHours" [min]="0"
                                suffix=" hrs"></p-inputNumber>
                        </div>
                        <div class="field col">
                            <label for="addPractical" class="font-semibold">Practical</label>
                            <p-inputNumber id="addPractical" [(ngModel)]="addSubjectObj.practicalHours" [min]="0"
                                suffix=" hrs"></p-inputNumber>
                        </div>
                    </div>

                    <div class="field mb-4">
                        <label for="addDesc" class="font-semibold">Description</label>
                        <textarea id="addDesc" pInputTextarea [(ngModel)]="addSubjectObj.description"
                            rows="3"></textarea>
                    </div>

                    <div class="flex justify-end gap-2 mt-4">
                        <button pButton pRipple label="Cancel" icon="pi pi-times" class="p-button-text"
                            (click)="activeTabIndex = 1; submitted = false"></button>
                        <button pButton pRipple label="Save" icon="pi pi-check" class="p-button-primary"
                            (click)="saveAddSubject()"></button>
                    </div>
                </div>
            </p-tabpanel>

            <p-tabpanel value="1">
                <div class="mt-3">
                    <app-standard-list-view [config]="listViewConfig" [data]="subjects"></app-standard-list-view>
                </div>
            </p-tabpanel>
        </p-tabpanels>
    </p-tabs>

    <!-- Edit Dialog left as-is for editing workflow -->
    <p-dialog [(visible)]="subjectDialog" [style]="{ width: '450px' }" header="Edit Subject Details" [modal]="true"
        styleClass="p-fluid">
        <ng-template pTemplate="content">
            <div class="field">
                <label for="subjectName" class="font-semibold">Subject Name</label>
                <input type="text" pInputText id="subjectName" [(ngModel)]="subject.subjectName" required autofocus
                    placeholder="e.g. Applied Physics" />
                <small class="p-error" *ngIf="submitted && !subject.subjectName">Name is required.</small>
            </div>
            <div class="field">
                <label for="subjectCode" class="font-semibold">Subject Code</label>
                <input type="text" pInputText id="subjectCode" [(ngModel)]="subject.subjectCode" required
                    placeholder="e.g. PHY-101" />
                <small class="p-error" *ngIf="submitted && !subject.subjectCode">Code is required.</small>
            </div>
            <div class="formgrid grid">
                <div class="field col">
                    <label for="category" class="font-semibold">Category</label>
                    <input type="text" pInputText id="category" [(ngModel)]="subject.category"
                        placeholder="e.g. CORE" />
                </div>
                <div class="field col">
                    <label for="credits" class="font-semibold">Credits</label>
                    <p-inputNumber id="credits" [(ngModel)]="subject.credits" [min]="0" [max]="20"></p-inputNumber>
                </div>
            </div>
            <div class="formgrid grid">
                <div class="field col">
                    <label for="theory" class="font-semibold">Theory Hrs</label>
                    <p-inputNumber id="theory" [(ngModel)]="subject.theoryHours" [min]="0"
                        suffix=" hrs"></p-inputNumber>
                </div>
                <div class="field col">
                    <label for="lab" class="font-semibold">Lab Hrs</label>
                    <p-inputNumber id="lab" [(ngModel)]="subject.labHours" [min]="0" suffix=" hrs"></p-inputNumber>
                </div>
                <div class="field col">
                    <label for="practical" class="font-semibold">Practical</label>
                    <p-inputNumber id="practical" [(ngModel)]="subject.practicalHours" [min]="0"
                        suffix=" hrs"></p-inputNumber>
                </div>
            </div>
            <div class="field">
                <label for="desc" class="font-semibold">Description</label>
                <textarea id="desc" pInputTextarea [(ngModel)]="subject.description" rows="2"></textarea>
            </div>
        </ng-template>

        <ng-template pTemplate="footer">
            <button pButton label="Cancel" icon="pi pi-times" class="p-button-text" (click)="hideDialog()"></button>
            <button pButton label="Save" icon="pi pi-check" class="p-button-text" (click)="saveEditSubject()"></button>
        </ng-template>
    </p-dialog>
</div>
