<div class="card p-4">
    <p-tabs [value]="activeTabIndex.toString()" (valueChange)="activeTabIndex = +$event">
        <p-tablist>
            <p-tab value="0">Add {{ tenantConfig?.courseLabel || 'Course' }}</p-tab>
            <p-tab value="1">View {{ tenantConfig?.courseLabel || 'Course' }}s</p-tab>
        </p-tablist>
        <p-tabpanels>
            <p-tabpanel value="0">
                <div class="p-fluid mt-4 max-w-4xl">
                    <div class="field mb-4">
                        <label for="addCourseName" class="font-semibold">Course Name</label>
                        <input type="text" pInputText id="addCourseName" [(ngModel)]="addCourseObj.courseName" required
                            autofocus />
                        <small class="text-red-500" *ngIf="submitted && !addCourseObj.courseName">Name is
                            required.</small>
                    </div>
                    <div class="grid grid-cols-2 gap-4">
                        <div class="field mb-4">
                            <label for="addCourseCode" class="font-semibold">Course Code</label>
                            <input type="text" pInputText id="addCourseCode" [(ngModel)]="addCourseObj.courseCode"
                                required />
                            <small class="text-red-500" *ngIf="submitted && !addCourseObj.courseCode">Code is
                                required.</small>
                        </div>
                        <div class="field mb-4">
                            <label for="addCategory" class="font-semibold">Category</label>
                            <input type="text" pInputText id="addCategory" [(ngModel)]="addCourseObj.category"
                                placeholder="e.g. Engineering" />
                        </div>
                    </div>
                    <div class="grid grid-cols-2 gap-4">
                        <div class="field mb-4">
                            <label for="addDurationYears" class="font-semibold">Duration (Years)</label>
                            <p-inputNumber id="addDurationYears" [(ngModel)]="addCourseObj.durationYears" [min]="1"
                                [max]="10"></p-inputNumber>
                        </div>
                        <div class="field mb-4">
                            <label for="addTotalSemesters" class="font-semibold">Semesters</label>
                            <p-inputNumber id="addTotalSemesters" [(ngModel)]="addCourseObj.totalSemesters" [min]="1"
                                [max]="20"></p-inputNumber>
                        </div>
                    </div>
                    <div class="field mb-4">
                        <label for="addDescription" class="font-semibold">Description</label>
                        <textarea pInputTextarea id="addDescription" [(ngModel)]="addCourseObj.description"
                            rows="3"></textarea>
                    </div>
                    <div class="field mb-4">
                        <label for="addEligibilityCriteria" class="font-semibold">Eligibility Criteria</label>
                        <input type="text" pInputText id="addEligibilityCriteria"
                            [(ngModel)]="addCourseObj.eligibilityCriteria" />
                    </div>
                    <div class="flex justify-end gap-2 mt-4">
                        <button pButton pRipple label="Cancel" icon="pi pi-times" class="p-button-text"
                            (click)="activeTabIndex = 1; submitted = false"></button>
                        <button pButton pRipple label="Save" icon="pi pi-check" class="p-button-primary"
                            (click)="saveAddCourse()"></button>
                    </div>
                </div>
            </p-tabpanel>
            <p-tabpanel value="1">
                <div class="mt-3">
                    <app-standard-list-view [config]="listViewConfig" [data]="courses"></app-standard-list-view>
                </div>
            </p-tabpanel>
        </p-tabpanels>
    </p-tabs>

    <!-- Course Edit Dialog (kept as dialog for consistency with editing pattern) -->
    <p-dialog [(visible)]="courseDialog" [style]="{width: '550px'}" header="Edit Course Details" [modal]="true"
        class="p-fluid">
        <ng-template pTemplate="content">
            <div class="field mb-4">
                <label for="courseName" class="font-semibold">Course Name</label>
                <input type="text" pInputText id="courseName" [(ngModel)]="course.courseName" required autofocus />
                <small class="text-red-500" *ngIf="submitted && !course.courseName">Name is required.</small>
            </div>
            <div class="grid grid-cols-2 gap-4">
                <div class="field mb-4">
                    <label for="courseCode" class="font-semibold">Course Code</label>
                    <input type="text" pInputText id="courseCode" [(ngModel)]="course.courseCode" required />
                    <small class="text-red-500" *ngIf="submitted && !course.courseCode">Code is required.</small>
                </div>
                <div class="field mb-4">
                    <label for="category" class="font-semibold">Category</label>
                    <input type="text" pInputText id="category" [(ngModel)]="course.category"
                        placeholder="e.g. Engineering" />
                </div>
            </div>
            <div class="grid grid-cols-2 gap-4">
                <div class="field mb-4">
                    <label for="durationYears" class="font-semibold">Duration (Years)</label>
                    <p-inputNumber id="durationYears" [(ngModel)]="course.durationYears" [min]="1"
                        [max]="10"></p-inputNumber>
                </div>
                <div class="field mb-4">
                    <label for="totalSemesters" class="font-semibold">Semesters</label>
                    <p-inputNumber id="totalSemesters" [(ngModel)]="course.totalSemesters" [min]="1"
                        [max]="20"></p-inputNumber>
                </div>
            </div>
            <div class="field mb-4">
                <label for="description" class="font-semibold">Description</label>
                <textarea pInputTextarea id="description" [(ngModel)]="course.description" rows="3"></textarea>
            </div>
            <div class="field mb-4">
                <label for="eligibilityCriteria" class="font-semibold">Eligibility Criteria</label>
                <input type="text" pInputText id="eligibilityCriteria" [(ngModel)]="course.eligibilityCriteria" />
            </div>
        </ng-template>

        <ng-template pTemplate="footer">
            <button pButton pRipple label="Cancel" icon="pi pi-times" class="p-button-text"
                (click)="hideDialog()"></button>
            <button pButton pRipple label="Save" icon="pi pi-check" class="p-button-text"
                (click)="saveEditCourse()"></button>
        </ng-template>
    </p-dialog>
</div>
