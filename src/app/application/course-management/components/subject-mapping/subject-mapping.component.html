<div class="card">
    <div class="flex justify-content-between align-items-center mb-4">
        <div>
            <h2 class="m-0 text-primary font-bold">Curriculum Mapping</h2>
            <p class="text-500 m-0" *ngIf="selectedCourse">Mapping subjects for <strong>{{ selectedCourse.courseName
                    }}</strong> ({{ selectedCourse.courseCode }})</p>
        </div>
        <button pButton label="Back to Courses" icon="pi pi-arrow-left" class="p-button-outlined"
            (click)="goBack()"></button>
    </div>

    <!-- Course Selector (if not pre-selected) -->
    <div *ngIf="!selectedCourse" class="field">
        <label for="courseSelect" class="block font-bold mb-2">Select Course to Configure</label>
        <p-dropdown [options]="courses" [(ngModel)]="selectedCourse" optionLabel="courseName" [filter]="true"
            filterBy="courseName" placeholder="Choose a Course" (onChange)="onCourseSelect()"></p-dropdown>
    </div>

    <div *ngIf="selectedCourse" class="mt-4">
        <p-tabView [(activeIndex)]="activeSemesterIndex" (onChange)="refreshAvailableSubjects()">
            <p-tabPanel *ngFor="let sem of semesters; let i = index" [header]="'Semester ' + (i + 1)">
                <div class="p-3">
                    <p-pickList [source]="availableSubjects" [target]="assignedSubjects[i + 1] || []"
                        sourceHeader="Available Subjects" targetHeader="Assigned to Semester {{ i + 1 }}"
                        [dragdrop]="true" [responsive]="true" [sourceStyle]="{ height: '30rem' }"
                        [targetStyle]="{ height: '30rem' }" breakpoint="1400px"
                        (onMoveToTarget)="onMoveToTarget($event, i + 1)"
                        (onMoveToSource)="onMoveToSource($event, i + 1)">
                        <ng-template let-subject pTemplate="item">
                            <div class="flex flex-wrap p-2 align-items-center gap-3">
                                <span
                                    class="font-bold border-circle w-2rem h-2rem flex align-items-center justify-content-center bg-primary text-white">
                                    {{ subject.subjectCode.substring(0, 2) }}
                                </span>
                                <div class="flex-1 flex flex-column gap-2">
                                    <span class="font-bold">{{ subject.subjectName }}</span>
                                    <div class="flex align-items-center gap-2 text-sm text-500">
                                        <i class="pi pi-tag text-xs"></i>
                                        <span>{{ subject.subjectCode }}</span>
                                        <span class="text-xs border-1 px-1 border-round surface-border ml-2">{{
                                            subject.category || 'General' }}</span>
                                    </div>
                                </div>
                                <span class="font-bold text-900">{{ subject.credits || 0 }} Credits</span>
                            </div>
                        </ng-template>
                    </p-pickList>

                    <div class="flex justify-content-end mt-3">
                        <button pButton label="Save Changes for Semester {{ i + 1 }}" icon="pi pi-save"
                            (click)="saveMapping(i + 1)" [loading]="saving"></button>
                    </div>
                </div>
            </p-tabPanel>
        </p-tabView>
    </div>
</div>
