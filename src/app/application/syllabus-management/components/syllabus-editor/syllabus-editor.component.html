<div class="p-fluid">
    <p-toast></p-toast>
    <form [formGroup]="syllabusForm">
        <div class="grid mb-4">
            <div class="col-12 md:col-6 field">
                <label>Code <span class="text-red-500">*</span></label>
                <input pInputText formControlName="syllabusCode" class="w-full"
                    [class.ng-invalid]="syllabusForm.get('syllabusCode')?.invalid && syllabusForm.get('syllabusCode')?.touched" />
                <small class="p-error block"
                    *ngIf="syllabusForm.get('syllabusCode')?.invalid && syllabusForm.get('syllabusCode')?.touched">Code
                    is required.</small>
            </div>
            <div class="col-12 md:col-6 field">
                <label>Version</label>
                <input pInputText formControlName="version" [readonly]="true" class="w-full bg-gray-100" />
            </div>
        </div>

        <h3>Chapters</h3>
        <p-accordion>
            <div formArrayName="chapters">
                <p-accordionTab *ngFor="let chapter of chapters.controls; let i=index" [header]="'Chapter ' + (i+1)"
                    [selected]="true">
                    <div [formGroupName]="i" class="p-3">
                        <div class="field">
                            <label>Chapter Name <span class="text-red-500">*</span></label>
                            <input pInputText formControlName="name" class="w-full" placeholder="Ex: Derivatives"
                                [class.ng-invalid]="chapter.get('name')?.invalid && chapter.get('name')?.touched" />
                            <small class="p-error"
                                *ngIf="chapter.get('name')?.invalid && chapter.get('name')?.touched">Chapter Name is
                                required.</small>
                        </div>

                        <div class="ml-4 mt-3">
                            <h4>Topics</h4>
                            <div formArrayName="topics">
                                <div *ngFor="let topic of getTopics(i).controls; let j=index" [formGroupName]="j"
                                    class="flex gap-2 mb-2">
                                    <input pInputText formControlName="name" placeholder="Topic Name"
                                        class="flex-grow-1" />
                                    <input pInputText type="number" formControlName="estimatedMinutes"
                                        placeholder="Mins" style="width: 100px" />
                                    <button pButton icon="pi pi-trash" class="p-button-danger p-button-text"
                                        (click)="getTopics(i).removeAt(j)"></button>
                                </div>
                            </div>
                            <button pButton label="Add Topic" icon="pi pi-plus"
                                class="p-button-sm p-button-outlined mt-2" (click)="addTopic(i)"></button>
                        </div>
                    </div>
                </p-accordionTab>
            </div>
        </p-accordion>
        <button pButton label="Add Chapter" icon="pi pi-plus" class="mt-3 w-full p-button-outlined"
            (click)="addChapter()"></button>

        <div class="flex justify-content-end gap-2 mt-5">
            <button pButton label="Cancel" type="button" icon="pi pi-times" class="p-button-text"
                (click)="onCancel()"></button>
            <button pButton label="Save Syllabus" type="button" icon="pi pi-check" class="p-button-primary"
                (click)="onSubmit()" [loading]="saving"></button>
        </div>
    </form>
</div>
