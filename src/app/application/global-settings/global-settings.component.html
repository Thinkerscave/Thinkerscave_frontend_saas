<div class="settings-drawer-body">
  <p class="settings-drawer-body__intro">{{ subtitle() }}</p>

  <div *ngIf="savedFlash()" class="settings-toast" role="status">
    <i class="pi pi-check-circle"></i> {{ 'settings.saved' | tcTranslate }}
  </div>

  <tc-saas-tabs [tabs]="tabs()" [active]="active()" (changeTab)="selectTab($event)"></tc-saas-tabs>

  <tc-saas-panel *ngIf="active() === 'appearance'"
    [title]="'settings.appearance' | tcTranslate"
    [subtitle]="'settings.appearanceSubtitle' | tcTranslate">
    <div class="form-grid">
      <div class="form-row">
        <label>{{ 'settings.theme' | tcTranslate }}</label>
        <div class="control">
          <button type="button" class="toggle" [class.on]="!isDark()" (click)="isDark() && toggleTheme()">
            <i class="pi pi-sun"></i>{{ 'settings.themeLight' | tcTranslate }}
          </button>
          <button type="button" class="toggle" [class.on]="isDark()" (click)="!isDark() && toggleTheme()">
            <i class="pi pi-moon"></i>{{ 'settings.themeDark' | tcTranslate }}
          </button>
        </div>
      </div>

      <div class="form-row">
        <label>{{ 'settings.accent' | tcTranslate }}</label>
        <div class="control accent-control">
          <div class="accent-swatches" role="list">
            <button
              type="button"
              class="accent-swatch"
              *ngFor="let color of accentPresets"
              role="listitem"
              [class.is-active]="isPresetAccent(color)"
              [style.--swatch]="color"
              [attr.aria-label]="'Accent ' + color"
              (click)="selectAccent(color)">
            </button>
            <button
              type="button"
              class="accent-swatch accent-swatch--custom"
              [class.is-active]="customAccent()"
              (click)="enableCustomAccent()">
              {{ 'settings.accentCustom' | tcTranslate }}
            </button>
          </div>
          <input
            *ngIf="customAccent()"
            type="color"
            [ngModel]="accent()"
            (ngModelChange)="accent.set($event)">
          <span class="muted">{{ accent() }}</span>
        </div>
      </div>

      <div class="form-row">
        <label>{{ 'settings.defaultView' | tcTranslate }}</label>
        <div class="control control--stack">
          <div class="control">
            <button type="button" class="toggle" [class.on]="defaultView() === 'grid'" (click)="defaultView.set('grid')">
              <i class="pi pi-th-large"></i>{{ 'settings.defaultViewGrid' | tcTranslate }}
            </button>
            <button type="button" class="toggle" [class.on]="defaultView() === 'table'" (click)="defaultView.set('table')">
              <i class="pi pi-list"></i>{{ 'settings.defaultViewTable' | tcTranslate }}
            </button>
          </div>
          <small class="hint">{{ 'settings.defaultViewHint' | tcTranslate }}</small>
        </div>
      </div>

      <div class="form-row">
        <label>{{ 'settings.reduceMotion' | tcTranslate }}</label>
        <div class="control control--stack">
          <label class="switch">
            <input type="checkbox" [ngModel]="reduceMotion()" (ngModelChange)="reduceMotion.set($event)">
            <span></span>
          </label>
          <small class="hint">{{ 'settings.reduceMotionHint' | tcTranslate }}</small>
        </div>
      </div>

      <div class="form-row" *ngIf="pwa.canInstall() || pwa.showIosInstallHint() || pwa.isInstalled()">
        <label>{{ 'settings.installApp' | tcTranslate }}</label>
        <div class="control install-control">
          <ng-container *ngIf="pwa.isInstalled(); else installActions">
            <span class="muted"><i class="pi pi-check-circle"></i> {{ 'settings.installed' | tcTranslate }}</span>
          </ng-container>
          <ng-template #installActions>
            <button *ngIf="pwa.canInstall()" type="button" class="btn-primary" (click)="installApp()">
              <i class="pi pi-download"></i> {{ 'settings.addToHomeScreen' | tcTranslate }}
            </button>
            <span *ngIf="!pwa.canInstall() && pwa.showIosInstallHint()" class="muted">
              {{ 'settings.iosInstallHint' | tcTranslate }}
            </span>
          </ng-template>
        </div>
      </div>
    </div>
  </tc-saas-panel>

  <tc-saas-panel *ngIf="active() === 'notifications'"
    [title]="'settings.notifications' | tcTranslate"
    [subtitle]="'settings.notificationsSubtitle' | tcTranslate">
    <div class="form-grid">
      <div class="form-row">
        <label>{{ 'settings.notifEmail' | tcTranslate }}</label>
        <div class="control">
          <label class="switch">
            <input type="checkbox" [ngModel]="notifEmail()" (ngModelChange)="notifEmail.set($event)">
            <span></span>
          </label>
        </div>
      </div>
      <div class="form-row">
        <label>{{ 'settings.notifPush' | tcTranslate }}</label>
        <div class="control">
          <label class="switch">
            <input type="checkbox" [ngModel]="notifPush()" (ngModelChange)="notifPush.set($event)">
            <span></span>
          </label>
        </div>
      </div>
      <div class="form-row">
        <label>{{ 'settings.notifSms' | tcTranslate }}</label>
        <div class="control">
          <label class="switch">
            <input type="checkbox" [ngModel]="notifSms()" (ngModelChange)="notifSms.set($event)">
            <span></span>
          </label>
        </div>
      </div>
      <div class="form-row">
        <label>{{ 'settings.digestCadence' | tcTranslate }}</label>
        <div class="control">
          <p-dropdown
            [options]="digestOptions()"
            [ngModel]="notifDigest()"
            (ngModelChange)="notifDigest.set($event)"
            optionLabel="label"
            optionValue="value"
            appendTo="body"
            styleClass="settings-dropdown">
          </p-dropdown>
        </div>
      </div>
    </div>
  </tc-saas-panel>

  <tc-saas-panel *ngIf="active() === 'localization'"
    [title]="'settings.localization' | tcTranslate"
    [subtitle]="'settings.localizationSubtitle' | tcTranslate">
    <div class="form-grid">
      <div class="form-row">
        <label>{{ 'settings.language' | tcTranslate }}</label>
        <div class="control">
          <p-dropdown
            [options]="languageOptions"
            [ngModel]="language()"
            (ngModelChange)="selectLanguage($event)"
            optionLabel="label"
            optionValue="value"
            appendTo="body"
            styleClass="settings-dropdown">
          </p-dropdown>
        </div>
      </div>
      <div class="form-row">
        <label>{{ 'settings.timezone' | tcTranslate }}</label>
        <div class="control">
          <p-dropdown
            [options]="timezoneOptions"
            [ngModel]="timezone()"
            (ngModelChange)="timezone.set($event)"
            optionLabel="label"
            optionValue="value"
            appendTo="body"
            styleClass="settings-dropdown">
          </p-dropdown>
        </div>
      </div>
      <div class="form-row">
        <label>{{ 'settings.dateFormat' | tcTranslate }}</label>
        <div class="control">
          <p-dropdown
            [options]="dateFormatOptions"
            [ngModel]="dateFormat()"
            (ngModelChange)="dateFormat.set($event)"
            optionLabel="label"
            optionValue="value"
            appendTo="body"
            styleClass="settings-dropdown">
          </p-dropdown>
        </div>
      </div>
    </div>
  </tc-saas-panel>

  <div class="settings-account">
    <button type="button" class="settings-account__link" (click)="goChangePassword()">
      <i class="pi pi-key"></i>
      <span>
        <strong>{{ 'settings.changePassword' | tcTranslate }}</strong>
        <small>{{ 'settings.changePasswordHint' | tcTranslate }}</small>
      </span>
    </button>
  </div>
</div>
