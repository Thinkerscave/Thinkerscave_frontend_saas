<p-toast></p-toast>
<section class="submenu-admin-page">
<div class="menu-page-header">
  <div>
    <span class="eyebrow">Administration</span>
    <h1>Sub-menu Management</h1>
    <p>Map child pages to parent menus, routes, icons, and allowed privileges.</p>
  </div>
  <div class="header-icon"><i class="pi pi-list-check"></i></div>
</div>

<p-tabView [(activeIndex)]="activeTabIndex">
  <p-tabPanel [header]="isEditMode ? 'Edit' : 'Add'">
    <p-card styleClass="submenu-form-card">
      <div class="p-fluid p-formgrid grid">
        <div class="col-12 md:col-6 lg:col-4">
          <label for="menu" class="mb-2 block">Select Menu</label>
          <p-dropdown id="menu" [options]="menuOptions" optionLabel="name" optionValue="menuId"
            placeholder="Choose Menu" [(ngModel)]="selectedMenuId" class="w-full">
          </p-dropdown>
        </div>
        <div class="col-12 md:col-6 lg:col-4">
          <label for="subMenuName" class="mb-2 block">Sub-Menu Name</label>
          <input id="subMenuName" type="text" pInputText [(ngModel)]="subMenuName" placeholder="Enter sub-menu name"
            class="w-full" />
        </div>

        <div class="col-12 md:col-6 lg:col-4">
          <label for="subMenuUrl" class="mb-2 block">Sub-Menu URL</label>
          <input id="subMenuUrl" type="text" pInputText [(ngModel)]="submenuUrl" placeholder="Enter sub-menu URL"
            class="w-full" />
        </div>

        <div class="col-12 md:col-6 lg:col-4">
          <label for="subMenuIcon" class="mb-2 block">Prime Icon</label>
          <span class="p-input-icon-left w-full">
            <i [ngClass]="submenuIcon || 'pi pi-circle'"></i>
            <input id="subMenuIcon" type="text" pInputText [(ngModel)]="submenuIcon" placeholder="pi pi-circle"
              class="w-full icon-input" />
          </span>
        </div>

        <div class="col-12 md:col-6 lg:col-4">
          <label for="subMenuOrder" class="mb-2 block">Display Order</label>
          <input id="subMenuOrder" type="number" pInputText [(ngModel)]="submenuOrder" placeholder="Auto" class="w-full" />
        </div>

        <div class="col-12 md:col-6 lg:col-4">
          <label for="privileges" class="mb-2 block">Select Privileges</label>
          <p-multiSelect [options]="privilegeOptions" [(ngModel)]="selectedPrivilegeIds" optionLabel="privilegeName"
            optionValue="privilegeId" placeholder="Choose Privileges" display="chip" class="w-full">
          </p-multiSelect>
        </div>

        <div class="col-12">
          <label for="subMenuDescription" class="mb-2 block">Sub-Menu Description</label>
          <textarea id="subMenuDescription" pInputTextarea [(ngModel)]="subMenuDescription" [rows]="2"
            placeholder="Enter Sub-menu description" class="w-full p-3"></textarea>
        </div>


        <div class="col-12">
          <div class="form-actions">
            <button pButton *ngIf="!isEditMode" label="Reset" icon="pi pi-refresh" class="p-button-secondary p-button-outlined" (click)="resetForm()"></button>
            <button pButton *ngIf="isEditMode" label="Cancel" icon="pi pi-times" class="p-button-secondary p-button-outlined" (click)="cancelEdit()"></button>
            <button pButton [label]="isEditMode ? 'Update' : 'Submit'" class="p-button-success"
              [icon]="isEditMode ? 'pi pi-save' : 'pi pi-plus'" (click)="submit()"></button>
          </div>
        </div>
      </div>
    </p-card>
  </p-tabPanel>

  <p-tabPanel header="View">
    <div class="menu-list-container p-fluid">

      <app-standard-list-view [config]="listViewConfig" [data]="submenuItems">
      </app-standard-list-view>

    </div>
  </p-tabPanel>
</p-tabView>
</section>
