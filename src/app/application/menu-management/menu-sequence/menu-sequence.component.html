<p-toast></p-toast>
<section class="sequence-page">
<div class="sequence-header">
  <div>
    <span class="eyebrow">Administration</span>
    <h1>Menu Sequence Management</h1>
    <p>Control the order of sidebar menu groups and sub-menu items.</p>
  </div>
  <div class="header-icon"><i class="pi pi-sort-alt"></i></div>
</div>

<p-card styleClass="sequence-card">
  <div class="grid">
    <!-- Menu Reordering -->
    <div class="col-12 md:col-6">
      <div class="list-title">
        <i class="pi pi-bars"></i>
        <h2>Menus</h2>
      </div>
      <p-orderList [value]="menus" dragdrop="true" [listStyle]="{ height: '300px' }" (onReorder)="onMenuReorder()">
        <ng-template let-menu pTemplate="item">
          <div class="order-item" [class.is-active]="activeMenuId === menu.menuId" (click)="onMenuClick(menu)">
            <span class="order-index">{{ menu.menuOrder }}</span>
            <span class="font-medium">{{ menu.menuName }}</span>
            <i class="pi pi-bars drag-icon"></i>
          </div>
        </ng-template>
      </p-orderList>
    </div>

    <!-- Submenu Reordering -->
    <div class="col-12 md:col-6">
      <div class="list-title">
        <i class="pi pi-list-check"></i>
        <h2>Sub-menus</h2>
      </div>

      <p-orderList 
        [value]="selectedSubmenus" 
        dragdrop="true" 
        [listStyle]="{ height: '300px' }" 
        (onReorder)="onSubMenuReorder()">
        <ng-template let-submenu pTemplate="item">
          <div class="order-item">
            <span class="order-index">{{ submenu.subMenuOrder }}</span>
            <span>{{ submenu.subMenuName }}</span>
            <i class="pi pi-bars drag-icon"></i>
          </div>
        </ng-template>
      </p-orderList>
    </div>
  </div>

  <!-- Submit Button -->
  <div class="flex justify-content-end mt-4">
    <button pButton label="Submit Order" icon="pi pi-save" class="p-button-success" (click)="submitOrder()"></button>
  </div>
</p-card>
</section>
