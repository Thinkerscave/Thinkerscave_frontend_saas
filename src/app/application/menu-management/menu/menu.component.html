<p-toast></p-toast>
<section class="menu-admin-page">
<div class="menu-page-header">
  <div>
    <span class="eyebrow">Administration</span>
    <h1>Menu Management</h1>
    <p>Define parent navigation groups, icons, routes, and display order.</p>
  </div>
  <div class="header-icon"><i class="pi pi-bars"></i></div>
</div>

<p-tabView [(activeIndex)]="activeTabIndex">
  <p-tabPanel [header]="isEditMode ? 'Edit' : 'Add'">
    <p-card styleClass="menu-form-card">
      <div class="p-fluid p-formgrid grid">
        <div class="col-12 md:col-6 lg:col-4">
          <label for="menuName" class="mb-2 block">Menu Name</label>
          <input id="menuName" type="text" pInputText [(ngModel)]="menuName" placeholder="Enter menu name"
            class="w-full" />
        </div>

        <div class="col-12 md:col-6 lg:col-4">
          <label for="menuIcon" class="mb-2 block">Prime Icon</label>
          <span class="p-input-icon-left w-full">
            <i [ngClass]="menuIcon || 'pi pi-folder'"></i>
            <input id="menuIcon" type="text" pInputText [(ngModel)]="menuIcon" placeholder="pi pi-folder"
              class="w-full icon-input" />
          </span>
        </div>

        <div class="col-12 md:col-6 lg:col-4">
          <label for="menuOrder" class="mb-2 block">Display Order</label>
          <input id="menuOrder" type="number" pInputText [(ngModel)]="menuOrder" placeholder="Auto" class="w-full" />
        </div>

        <div class="col-12 md:col-6 lg:col-4">
          <label for="menuUrl" class="mb-2 block">Route URL</label>
          <input id="menuUrl" type="text" pInputText [(ngModel)]="menuUrl" placeholder="/app/example"
            class="w-full" />
        </div>

        <div class="col-12 lg:col-8">
          <label for="menuDescription" class="mb-2 block">Menu Description</label>
          <textarea id="menuDescription" pInputTextarea [(ngModel)]="menuDescription" [rows]="2"
            placeholder="Enter menu description" class="w-full p-3"></textarea>
        </div>

        <div class="col-12">
          <div class="form-actions">
            <button pButton *ngIf="!isEditMode" label="Reset" icon="pi pi-refresh" class="p-button-secondary p-button-outlined" (click)="resetForm()"></button>
            <button pButton *ngIf="isEditMode" label="Cancel" icon="pi pi-times" class="p-button-secondary p-button-outlined" (click)="cancelEdit()"></button>
            <button pButton [label]="isEditMode ? 'Update' : 'Submit'" class="p-button-success"
              [icon]="isEditMode ? 'pi pi-save' : 'pi pi-plus'" (click)="submit()"></button>
          </div>
        </div>
      </div>
    </p-card>
  </p-tabPanel>

  <p-tabPanel header="View">
    <div class="menu-list-container p-fluid">

      <app-standard-list-view [config]="listViewConfig" [data]="menuItems">
      </app-standard-list-view>

    </div>
  </p-tabPanel>
</p-tabView>
</section>
