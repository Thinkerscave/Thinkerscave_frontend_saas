<p-toast></p-toast>
<p-confirmDialog [style]="{width: '450px'}"></p-confirmDialog>

<div class="card p-0 shadow-none border-none">
    <app-standard-list-view [config]="listViewConfig" [data]="staffSalaries">
    </app-standard-list-view>
</div>


<p-dialog [(visible)]="salaryDialogVisible" [style]="{width: '800px'}" header="Edit Salary Details" [modal]="true"
    class="p-fluid" (onHide)="hideDialog()">
    <form [formGroup]="salaryForm">

        <div class="formgrid grid">
            <div class="col-12 md:col-6">
                <h5 class="section-header">Earnings</h5>
                <div class="field">
                    <label for="basic">Basic Salary</label>
                    <p-inputNumber id="basic" formControlName="basic" mode="currency" currency="INR"
                        locale="en-IN"></p-inputNumber>
                </div>
                <div class="field">
                    <label for="hra">House Rent Allowance (HRA)</label>
                    <p-inputNumber id="hra" formControlName="hra" mode="currency" currency="INR"
                        locale="en-IN"></p-inputNumber>
                </div>
                <div class="field">
                    <label for="specialAllowance">Special Allowance</label>
                    <p-inputNumber id="specialAllowance" formControlName="specialAllowance" mode="currency"
                        currency="INR" locale="en-IN"></p-inputNumber>
                </div>
            </div>

            <div class="col-12 md:col-6">
                <h5 class="section-header">Deductions</h5>
                <div class="field">
                    <label for="providentFund">Provident Fund (PF)</label>
                    <p-inputNumber id="providentFund" formControlName="providentFund" mode="currency" currency="INR"
                        locale="en-IN"></p-inputNumber>
                </div>
                <div class="field">
                    <label for="professionalTax">Professional Tax</label>
                    <p-inputNumber id="professionalTax" formControlName="professionalTax" mode="currency" currency="INR"
                        locale="en-IN"></p-inputNumber>
                </div>
                <div class="field">
                    <label for="incomeTax">Income Tax (TDS)</label>
                    <p-inputNumber id="incomeTax" formControlName="incomeTax" mode="currency" currency="INR"
                        locale="en-IN"></p-inputNumber>
                </div>
            </div>
        </div>

        <div class="col-12 mt-4">
            <h5 class="section-header">Other Allowances</h5>
            <div class="formgrid grid">
                <div class="field col-12 md:col-4">
                    <label for="academicAllowance">Academic Allowance</label>
                    <p-inputNumber id="academicAllowance" formControlName="academicAllowance" mode="currency"
                        currency="INR" locale="en-IN"></p-inputNumber>
                </div>
                <div class="field col-12 md:col-4">
                    <label for="travelAllowance">Travel Allowance</label>
                    <p-inputNumber id="travelAllowance" formControlName="travelAllowance" mode="currency" currency="INR"
                        locale="en-IN"></p-inputNumber>
                </div>
                <div class="field col-12 md:col-4">
                    <label for="dearnessAllowance">Dearness Allowance</label>
                    <p-inputNumber id="dearnessAllowance" formControlName="dearnessAllowance" mode="currency"
                        currency="INR" locale="en-IN"></p-inputNumber>
                </div>
                <div class="field col-12 md:col-4">
                    <label for="medicalAllowance">Medical Allowance</label>
                    <p-inputNumber id="medicalAllowance" formControlName="medicalAllowance" mode="currency"
                        currency="INR" locale="en-IN"></p-inputNumber>
                </div>
                <div class="field col-12 md:col-4">
                    <label for="otherAllowance">Other Allowance</label>
                    <p-inputNumber id="otherAllowance" formControlName="otherAllowance" mode="currency" currency="INR"
                        locale="en-IN"></p-inputNumber>
                </div>
            </div>
        </div>

        <div class="col-12 mt-4">
            <h5 class="section-header">Monthly Salary Summary</h5>
            <div class="salary-summary p-4 grid">
                <div class="col-4 text-center">
                    <div class="text-color-secondary">Gross Earnings</div>
                    <div class="font-bold text-xl">{{grossSalary | currency:'INR':'symbol':'1.2-2'}}</div>
                </div>
                <div class="col-4 text-center">
                    <div class="text-color-secondary">Total Deductions</div>
                    <div class="font-bold text-xl">{{totalDeductions | currency:'INR':'symbol':'1.2-2'}}</div>
                </div>
                <div class="col-4 text-center">
                    <div class="text-green-600">Net Salary</div>
                    <div class="font-bold text-2xl text-green-600">{{netSalary | currency:'INR':'symbol':'1.2-2'}}
                    </div>
                </div>
            </div>
        </div>

    </form>
    <ng-template pTemplate="footer">
        <button pButton pRipple label="Cancel" icon="pi pi-times" class="p-button-text" (click)="hideDialog()"></button>
        <button pButton pRipple label="Save" icon="pi pi-check" (click)="saveSalary()"
            [disabled]="salaryForm.invalid"></button>
    </ng-template>
</p-dialog>
