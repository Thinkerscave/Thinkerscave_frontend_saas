<div class="saas-page attendance-calendar">
  <tc-saas-page-header title="Attendance Calendar" [breadcrumbs]="[{label:'Home',route:'/app'},{label:'Attendance'},{label:'Calendar'}]">
    <button type="button" class="tc-btn"><i class="pi pi-download"></i>Export</button>
  </tc-saas-page-header>

  <tc-saas-filter-row>
    <label class="saas-field"><span>Student</span>
      <p-dropdown
        [options]="studentSelectOptions"
        [(ngModel)]="filters.studentName"
        optionLabel="label"
        optionValue="value"
        [filter]="true"
        filterBy="label"
        appendTo="body">
      </p-dropdown>
    </label>
    <label class="saas-field"><span>Class</span>
      <p-dropdown
        [options]="classSelectOptions"
        [(ngModel)]="filters.classId"
        optionLabel="label"
        optionValue="value"
        [filter]="true"
        filterBy="label"
        appendTo="body">
      </p-dropdown>
    </label>
    <label class="saas-field"><span>Section</span>
      <p-dropdown
        [options]="sectionSelectOptions"
        [(ngModel)]="filters.sectionName"
        optionLabel="label"
        optionValue="value"
        appendTo="body">
      </p-dropdown>
    </label>
  </tc-saas-filter-row>

  <tc-saas-panel [title]="monthLabel" subtitle="Daily attendance visualization">
    <ng-container panel-actions>
      <button type="button" class="saas-icon-btn" (click)="prev()"><i class="pi pi-chevron-left"></i></button>
      <button type="button" class="saas-icon-btn" (click)="next()"><i class="pi pi-chevron-right"></i></button>
      <ul class="calendar-legend">
        <li><span class="dot dot--p"></span>Present</li>
        <li><span class="dot dot--a"></span>Absent</li>
        <li><span class="dot dot--l"></span>Late</li>
        <li><span class="dot dot--h"></span>No Attendance</li>
      </ul>
    </ng-container>

    <div class="calendar-grid calendar-grid--head">
      <span *ngFor="let d of weekDays">{{ d }}</span>
    </div>
    <div class="calendar-grid">
      <div *ngFor="let cell of days; trackBy: trackByDay" class="calendar-day"
           [class.is-other]="cell.otherMonth"
           [class.is-today]="cell.today"
           [class.is-weekend]="cell.weekend">
        <ng-container *ngIf="!cell.otherMonth">
          <span class="calendar-day__num">{{ cell.day }}</span>
          <span class="calendar-day__dot" [attr.data-status]="cell.status" *ngIf="cell.status"></span>
        </ng-container>
      </div>
    </div>
  </tc-saas-panel>

  <tc-saas-panel title="Attendance Summary" subtitle="Statistics for the current month">
    <tc-saas-stat-grid [stats]="summary"></tc-saas-stat-grid>
  </tc-saas-panel>
</div>
