<div class="saas-page attendance-settings">
  <tc-saas-page-header title="Settings" [breadcrumbs]="[{label:'Home',route:'/app'},{label:'Attendance'},{label:'Settings'}]">
    <button type="button" class="tc-btn" (click)="reset()" [disabled]="loading || saving">
      <i class="pi pi-refresh"></i>Reset defaults
    </button>
    <button type="button" class="tc-btn tc-btn--primary" (click)="save()" [disabled]="loading || saving">
      <i class="pi pi-save"></i>{{ saving ? 'Saving…' : 'Save Settings' }}
    </button>
  </tc-saas-page-header>

  <div *ngIf="saved" class="attendance-settings__toast"><i class="pi pi-check-circle"></i>Settings saved successfully</div>
  <div *ngIf="errorMessage" class="attendance-settings__toast attendance-settings__toast--error">
    <i class="pi pi-exclamation-triangle"></i>{{ errorMessage }}
  </div>

  <div *ngIf="loading" class="saas-empty attendance-settings__loading-empty">
    <i class="pi pi-spin pi-spinner"></i><strong>Loading settings…</strong>
  </div>

  <div class="attendance-settings__grid" *ngIf="!loading">
    <tc-saas-panel title="Attendance Mode" subtitle="Choose how attendance is captured">
      <div class="settings-radio-group">
        <label class="settings-radio">
          <input type="radio" name="mode" [(ngModel)]="settings.attendanceMode" value="DAILY">
          <div><strong>Daily</strong><small>Mark attendance once a day per student.</small></div>
        </label>
        <label class="settings-radio">
          <input type="radio" name="mode" [(ngModel)]="settings.attendanceMode" value="PERIOD">
          <div><strong>Period-wise</strong><small>Mark attendance per period for granular tracking.</small></div>
        </label>
      </div>
    </tc-saas-panel>

    <tc-saas-panel title="School Timings" subtitle="Operating hours for attendance window">
      <div class="settings-row">
        <label class="saas-field"><span>Start Time</span><input type="time" [(ngModel)]="settings.windowStartTime"></label>
        <label class="saas-field"><span>End Time</span><input type="time" [(ngModel)]="settings.windowEndTime"></label>
      </div>
    </tc-saas-panel>

    <tc-saas-panel title="Late Arrival Rule" subtitle="Mark students late after this time">
      <label class="saas-field"><span>Late After</span><input type="time" [(ngModel)]="settings.lateAfterTime"></label>
    </tc-saas-panel>

    <tc-saas-panel title="Defaulter Threshold" subtitle="Below this percent students appear as defaulters">
      <label class="saas-field"><span>Min Attendance %</span><input type="number" min="0" max="100" [(ngModel)]="settings.minStudentAttendancePercent"></label>
    </tc-saas-panel>

    <tc-saas-panel title="Attendance Freeze" subtitle="Prevent edits after the cut-off">
      <label class="settings-toggle">
        <input type="checkbox" [(ngModel)]="settings.allowCopyPrevious">
        <span>Allow Copy Previous Day on student roster</span>
      </label>
      <label class="saas-field att-freeze-field">
        <span>Enable freeze after</span>
        <p-dropdown
          [options]="freezeAfterOptions"
          [(ngModel)]="settings.freezeAfterDays"
          optionLabel="label"
          optionValue="value"
          appendTo="body"
          styleClass="att-filter-dropdown">
        </p-dropdown>
      </label>
      <small class="att-note att-note--tight">0 = no automatic freeze. Manual freeze periods remain available via API.</small>
    </tc-saas-panel>

    <tc-saas-panel title="Notifications" subtitle="Preference flags (dispatch is platform-managed; see Communication workflow)">
      <label class="settings-toggle"><input type="checkbox" [(ngModel)]="settings.sendSmsOnAbsent"><span>SMS on absent</span></label>
      <label class="settings-toggle"><input type="checkbox" [(ngModel)]="settings.sendEmailOnAbsent"><span>Email on absent</span></label>
      <small class="att-note">WhatsApp / Push are not persisted yet - Future Enhancement.</small>
    </tc-saas-panel>
  </div>
</div>
