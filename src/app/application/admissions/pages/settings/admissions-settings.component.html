<app-toast />

<section class="tc-page-shell adm-page">
  <tc-saas-page-header subtitle="Sources, documents, numbering, and counselor assignment for this school.">
    <button type="button" class="tc-btn" (click)="load()" [disabled]="loading" title="Reload tenant admissions settings">
      <i class="pi pi-refresh" [class.pi-spin]="loading"></i> Refresh
    </button>
    <button type="button" class="tc-btn tc-btn--primary" (click)="save()" [disabled]="loading || saving || !settings" title="Save admissions settings for this school">
      <i class="pi pi-save"></i> Save
    </button>
  </tc-saas-page-header>

  <div class="tc-empty-state tc-empty-state--inline" *ngIf="errorMessage">
    <i class="pi pi-exclamation-triangle"></i> {{ errorMessage }}
  </div>

  <div class="tc-loading" *ngIf="loading">
    <i class="pi pi-spin pi-spinner"></i> Loading settings…
  </div>

  <tc-saas-panel *ngIf="!loading && settings" title="School setup">
    <div class="adm-settings-layout">
      <div class="adm-form-grid">
        <div class="tc-form-field tc-form-field--full">
          <label>Lead sources</label>
          <textarea rows="5" [(ngModel)]="sourcesText" placeholder="Website&#10;Walk-in&#10;Referral"></textarea>
          <small class="adm-help-text">One source per line. Used on New Lead.</small>
        </div>
        <div class="tc-form-field tc-form-field--full">
          <label>Required documents</label>
          <textarea rows="5" [(ngModel)]="documentsText" placeholder="BIRTH_CERTIFICATE&#10;AADHAR&#10;TRANSFER_CERTIFICATE"></textarea>
          <small class="adm-help-text">One document type per line. Shown on the application form.</small>
        </div>
        <div class="tc-form-field tc-form-field--full">
          <label>Lead pipeline</label>
          <div class="adm-chip-row">
            <span class="adm-chip is-active" *ngFor="let status of pipelineStatuses">{{ status }}</span>
          </div>
          <small class="adm-help-text">Fixed CRM stages. Status changes happen from lead and follow-up actions.</small>
        </div>
      </div>

      <div class="adm-form-grid" style="grid-template-columns: 1fr;">
        <div class="tc-form-field">
          <label>Lead prefix</label>
          <input [(ngModel)]="leadPrefix" maxlength="8" />
        </div>
        <div class="tc-form-field">
          <label>Application prefix</label>
          <input [(ngModel)]="applicationPrefix" maxlength="8" />
        </div>
        <div class="tc-form-field">
          <label>Admission prefix</label>
          <input [(ngModel)]="admissionPrefix" maxlength="8" />
        </div>
        <div class="tc-form-field">
          <label>Counselor assignment</label>
          <p-dropdown
            [options]="assignmentOptions"
            [(ngModel)]="assignmentMode"
            optionLabel="label"
            optionValue="value"
            appendTo="body"
            styleClass="att-filter-dropdown">
          </p-dropdown>
        </div>
        <div class="tc-form-field">
          <label>Follow-up reminder</label>
          <p-dropdown
            [options]="reminderModeOptions"
            [(ngModel)]="reminderMode"
            optionLabel="label"
            optionValue="value"
            appendTo="body"
            styleClass="att-filter-dropdown">
          </p-dropdown>
        </div>
        <div class="tc-form-field">
          <label>Remind before</label>
          <p-dropdown
            [options]="reminderLeadOptions"
            [(ngModel)]="reminderLeadTime"
            optionLabel="label"
            optionValue="value"
            appendTo="body"
            styleClass="att-filter-dropdown">
          </p-dropdown>
        </div>
      </div>
    </div>
  </tc-saas-panel>
</section>
