<section class="tc-error-shell" aria-labelledby="maintenance-heading">
  <div class="tc-error-shell__card">
    <div class="tc-error-shell__brand" aria-hidden="true">
      <span class="tc-error-shell__mark">TC</span>
      <span class="tc-error-shell__name">ThinkersCave</span>
    </div>

    <app-empty-state
      [page]="true"
      illustration="maintenance"
      title="We'll be right back"
      message="We're performing scheduled maintenance to keep ThinkersCave reliable for your school. Please try again in a few minutes."
      actionLabel="Retry"
      actionIcon="pi pi-refresh"
      (action)="retry()">
      <a
        pButton
        routerLink="/auth/login"
        label="Go to Login"
        icon="pi pi-sign-in"
        class="p-button-outlined">
      </a>
    </app-empty-state>
  </div>
</section>
