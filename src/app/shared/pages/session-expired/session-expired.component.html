<div class="tc-error-shell">
  <div class="tc-error-shell__card">
    <app-empty-state
      [page]="true"
      illustration="expired"
      title="Session expired"
      message="Your session has expired due to inactivity. Please sign in again to continue working safely."
      actionLabel="Go to Login"
      actionIcon="pi pi-sign-in"
      (action)="redirectLogin()">
    </app-empty-state>
  </div>
</div>
