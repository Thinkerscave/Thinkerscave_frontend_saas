<header class="ws-header" [class.ws-header--sticky]="sticky">
  @if (breadcrumbs.length) {
    <p-breadcrumb [model]="breadcrumbs" [home]="home" class="ws-header__crumbs"></p-breadcrumb>
  }

  <div class="ws-header__row">
    <div class="ws-header__heading">
      <div class="ws-header__title-row">
        @if (icon) {
          <span class="ws-header__icon" aria-hidden="true">
            <i [class]="icon"></i>
          </span>
        }
        <h1 class="ws-header__title">{{ title }}</h1>
        @for (tag of tags; track tag.label) {
          <span class="ws-tag ws-tag--{{ tag.tone || 'default' }}">{{ tag.label }}</span>
        }
      </div>
      @if (subtitle) {
        <p class="ws-header__subtitle">{{ subtitle }}</p>
      }
      @if (description) {
        <p class="ws-header__desc">{{ description }}</p>
      }
    </div>

    <div class="ws-header__actions">
      <ng-content select="[actions]"></ng-content>
      @if (actionsTemplate) {
        <ng-container [ngTemplateOutlet]="actionsTemplate"></ng-container>
      }
    </div>
  </div>

  <div class="ws-header__filters">
    <ng-content select="[filters]"></ng-content>
  </div>
</header>
