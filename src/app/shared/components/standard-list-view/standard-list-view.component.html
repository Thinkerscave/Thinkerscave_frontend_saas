<div class="standard-list-view surface-card p-4 border-round-xl shadow-2">
    <!-- Header Section -->
    <div class="flex flex-column md:flex-row md:align-items-center justify-content-between mb-4 gap-3">
        <!-- Title & Subtitle -->
        <div>
            <h2 class="m-0 text-900 font-semibold text-2xl">{{ config.title }}</h2>
            <p *ngIf="config.subtitle" class="m-0 text-600 mt-1 text-sm">{{ config.subtitle }}</p>
        </div>

        <!-- Global Actions -->
        <div class="flex gap-2 align-items-center">
            <ng-container *ngFor="let action of config.secondaryActions">
                <button *ngIf="!action.visibleFn || action.visibleFn()" pButton [label]="action.label"
                    [icon]="action.icon || ''" class="p-button-outlined p-button-sm" (click)="action.actionFn()">
                </button>
            </ng-container>

            <button
                *ngIf="config.primaryAction && (!config.primaryAction.visibleFn || config.primaryAction.visibleFn())"
                pButton [label]="config.primaryAction.label" [icon]="config.primaryAction.icon || ''"
                class="p-button-primary p-button-sm" (click)="config.primaryAction.actionFn()">
            </button>
        </div>
    </div>

    <!-- Search & Filters Bar -->
    <div class="flex flex-column md:flex-row justify-content-between align-items-center mb-4 gap-3">
        <div class="p-input-icon-left w-full md:w-25rem" *ngIf="config.showSearch !== false">
            <i class="pi pi-search"></i>
            <input pInputText type="text" [(ngModel)]="globalFilter" (input)="onSearchChange()"
                [placeholder]="config.searchPlaceholder || 'Search '" class="w-full p-inputtext-sm border-round-lg" />
        </div>
        <div>
            <!-- Filters will go here in Phase 2 -->
        </div>
    </div>

    <!-- Data Table -->
    <p-table #dt [value]="data" [columns]="config.columns" [lazy]="!config.isClientSide"
        (onLazyLoad)="onLazyLoad($event)" [paginator]="true" [rows]="config.rows || 10"
        [totalRecords]="config.totalRecords || data.length" [loading]="config.loading"
        [rowsPerPageOptions]="config.rowsPerPageOptions || [10, 25, 50]" responsiveLayout="scroll"
        [globalFilterFields]="['orgName', 'ownerEmail', 'ownerName']" styleClass="p-datatable-sm p-datatable-striped"
        [rowHover]="true" currentPageReportTemplate="Showing {first} to {last} of {totalRecords} entries"
        [showCurrentPageReport]="true">

        <!-- Table Header -->
        <ng-template pTemplate="header" let-columns>
            <tr>
                <th *ngFor="let col of columns" [pSortableColumn]="col.sortable ? col.field : undefined"
                    [style]="{'width': col.width, 'text-align': col.align || 'left'}"
                    class="text-600 font-medium uppercase text-xs tracking-wide">
                    <div class="flex align-items-center gap-2"
                        [ngClass]="{'justify-content-center': col.align === 'center', 'justify-content-end': col.align === 'right'}">
                        <span class="white-space-nowrap">{{ col.header }}</span>
                        <p-sortIcon *ngIf="col.sortable" [field]="col.field"></p-sortIcon>
                    </div>
                </th>
                <th *ngIf="config.rowActions?.length" [style]="{'width': '100px', 'text-align': 'right'}"
                    class="text-600 font-medium uppercase text-xs tracking-wide sticky-right">
                    Actions
                </th>
            </tr>
        </ng-template>

        <!-- Table Body -->
        <ng-template pTemplate="body" let-rowData let-columns="columns">
            <tr>
                <td *ngFor="let col of columns" [style]="{'text-align': col.align || 'left'}" class="text-700">

                    <!-- Text Type -->
                    <span *ngIf="col.type === 'text'">{{ getCellData(rowData, col) }}</span>

                    <!-- Date Type -->
                    <span *ngIf="col.type === 'date'">{{ getCellData(rowData, col) | date:'mediumDate' }}</span>

                    <!-- Badge Type -->
                    <p-tag *ngIf="col.type === 'badge'" [value]="getCellData(rowData, col)"
                        [severity]="getBadgeSeverity(getCellData(rowData, col))" [rounded]="true">
                    </p-tag>

                    <!-- Tags Type -->
                    <div *ngIf="col.type === 'tags'" class="flex gap-1 flex-wrap">
                        <span *ngFor="let tag of getTagsData(rowData, col)"
                            class="p-tag p-tag-rounded p-tag-info p-tag-sm">
                            {{ tag }}
                        </span>
                    </div>

                    <!-- Boolean Type -->
                    <span *ngIf="col.type === 'boolean'">
                        <i class="pi"
                            [ngClass]="{'pi-check-circle text-green-500': getCellData(rowData, col), 'pi-times-circle text-red-500': !getCellData(rowData, col)}"></i>
                    </span>
                </td>

                <!-- Actions Column -->
                <td *ngIf="config.rowActions?.length" class="text-right sticky-right whitespace-nowrap">
                    <div class="flex justify-content-end gap-2">
                        <!-- Primary Actions (Standalone Buttons) -->
                        <ng-container *ngFor="let action of primaryRowActions">
                            <button *ngIf="!action.visibleFn || action.visibleFn(rowData)" pButton pRipple
                                [icon]="action.icon || 'pi pi-cog'" class="p-button-rounded p-button-text p-button-sm"
                                [class.p-button-danger]="action.color === 'danger'"
                                [class.p-button-success]="action.color === 'success'" [pTooltip]="action.label"
                                tooltipPosition="top" (click)="action.actionFn(rowData)">
                            </button>
                        </ng-container>

                        <!-- Secondary Actions (More Menu) -->
                        <ng-container *ngIf="secondaryRowActions.length > 0">
                            <p-menu #menu [model]="getMenuModel(rowData, secondaryRowActions)" [popup]="true"
                                appendTo="body"></p-menu>
                            <button pButton pRipple icon="pi pi-ellipsis-v"
                                class="p-button-rounded p-button-text p-button-sm text-600"
                                (click)="menu.toggle($event)">
                            </button>
                        </ng-container>
                    </div>
                </td>
            </tr>
        </ng-template>

        <!-- Empty State -->
        <ng-template pTemplate="emptymessage">
            <tr>
                <td [attr.colspan]="config.columns.length + (config.rowActions?.length ? 1 : 0)"
                    class="text-center p-5">
                    <div class="flex flex-column align-items-center justify-content-center text-500">
                        <i class="pi pi-inbox text-4xl mb-3 text-300"></i>
                        <span class="text-lg">No records found</span>
                        <span class="text-sm mt-1">Try adjusting your search or filters.</span>
                    </div>
                </td>
            </tr>
        </ng-template>
    </p-table>
</div>
