<div class="empty-state" [class.empty-state--compact]="compact" role="status">
    <div class="empty-state__art">
        <i [class]="icon" aria-hidden="true"></i>
    </div>
    <h3 class="empty-state__title">{{ title }}</h3>
    <p *ngIf="message" class="empty-state__message">{{ message }}</p>

    <div class="empty-state__actions">
        <p-button *ngIf="actionLabel"
                  [label]="actionLabel"
                  [icon]="actionIcon ?? ''"
                  severity="primary"
                  (onClick)="action.emit()"></p-button>
        <ng-content></ng-content>
    </div>
</div>
