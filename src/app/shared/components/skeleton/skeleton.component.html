@switch (shape) {
    @case ('line') {
        <span class="sk sk--line" [style.width]="width" [style.height]="height"></span>
    }
    @case ('rect') {
        <span class="sk sk--rect" [style.width]="width" [style.height]="height"></span>
    }
    @case ('circle') {
        <span class="sk sk--circle" [style.width]="size" [style.height]="size"></span>
    }
    @case ('card') {
        <div class="sk-card">
            <span class="sk sk--rect sk-card__media"></span>
            <span class="sk sk--line" style="width: 70%"></span>
            <span class="sk sk--line" style="width: 90%"></span>
            <span class="sk sk--line" style="width: 50%"></span>
        </div>
    }
    @case ('list') {
        <div class="sk-list">
            @for (_ of rowsArr; track $index) {
                <div class="sk-list__row">
                    <span class="sk sk--circle" style="width: 36px; height: 36px;"></span>
                    <div class="sk-list__lines">
                        <span class="sk sk--line" style="width: 60%"></span>
                        <span class="sk sk--line" style="width: 40%"></span>
                    </div>
                </div>
            }
        </div>
    }
    @case ('table') {
        <div class="sk-table">
            @for (_ of rowsArr; track $index) {
                <div class="sk-table__row">
                    @for (__ of columnsArr; track $index) {
                        <span class="sk sk--line" [style.flex]="'1 1 0'"></span>
                    }
                </div>
            }
        </div>
    }
}
