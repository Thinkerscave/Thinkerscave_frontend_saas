# Public entry point (port 80) for ThinkersCave on the production host.
# Installed and reloaded automatically by .github/workflows/deploy.yml.
#
#   Internet -> host nginx :80 -> 127.0.0.1:8081 (frontend container)
#                                   |- static SPA
#                                   '- /api/ -> thinkerscave-backend:8080 (Docker network "web", not published)

server {
    listen 80 default_server;
    server_name _;

    # Spring allows 15MB multipart requests; keep the proxy limit just above it.
    client_max_body_size 20m;

    location / {
        proxy_pass http://127.0.0.1:8081;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }
}
